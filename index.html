<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>تحليل الأحياء - النسخة النهائية</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:tahoma;background:#f5f7fb}

.top{
position:absolute;top:10px;left:50%;transform:translateX(-50%);
background:#fff;padding:10px;border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,.18);
z-index:1000;
display:flex;gap:6px;flex-wrap:wrap
}

.top input,.top select,.top button{
padding:6px;border-radius:8px;border:1px solid #ddd
}

.top button{
background:#0ea5e9;color:#fff;border:none
}

#map{height:60vh}

.bottomWrap{
display:grid;
grid-template-columns:300px 1fr 1fr;
gap:10px;
padding:10px
}

.card{
background:#fff;
padding:10px;
border-radius:12px
}

.mapLabel{
background:#fff;
padding:4px 6px;
border-radius:6px;
font-size:12px;
font-weight:bold;
white-space:nowrap;
box-shadow:0 2px 6px rgba(0,0,0,.2)
}
</style>
</head>

<body>

<div class="top">

<input type="file" id="file">
<button onclick="loadExcel()">رفع</button>

<select id="municipalityFilter" onchange="applyCurrentFilter()">
<option value="all">كل البلديات</option>
</select>

<select id="dateFilter" onchange="applyCurrentFilter()">
<option value="all">كل الأشهر</option>
</select>

<select id="filterSelect" onchange="applyCurrentFilter()">
<option value="all">الكل</option>
<option value="5">أعلى 5</option>
<option value="10">أعلى 10</option>
</select>

<input id="searchBox" placeholder="بحث..." oninput="applyCurrentFilter()">

</div>

<div id="map"></div>

<div class="bottomWrap">

<div class="card">
<canvas id="chartDistrict"></canvas>
</div>

<div class="card">
<canvas id="chartCategory"></canvas>
</div>

</div>

<script>

let map;
let rawData=[],filteredData=[];
let polygons=[],labels=[];
let chart1,chart2;

function normalize(t){
return String(t||"")
.trim()
.replace(/\s+/g," ")
.replace(/[أإآ]/g,"ا")
.replace(/ة/g,"ه");
}

function initMap(){
map=L.map('map').setView([21.4,40.4],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

map.on('zoomend',()=>drawMap(currentDistricts));
}

function loadExcel(){
const file=document.getElementById("file").files[0];
const reader=new FileReader();

reader.onload=e=>{
const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});

let muniSet=new Set(),dateSet=new Set();
rawData=[];

for(let i=1;i<rows.length;i++){
let r=rows[i];

let item={
lng:+r[0],
lat:+r[1],
district:normalize(r[2]),
municipality:normalize(r[3]),
date:normalize(r[4]),
category:normalize(r[5])
};

if(isNaN(item.lat)||isNaN(item.lng))continue;

rawData.push(item);

muniSet.add(item.municipality);
dateSet.add(item.date);
}

fillSelect("municipalityFilter",muniSet);
fillSelect("dateFilter",dateSet);

applyCurrentFilter();
};

reader.readAsArrayBuffer(file);
}

function fillSelect(id,set){
let el=document.getElementById(id);
el.innerHTML='<option value="all">الكل</option>';
[...set].forEach(v=>{
el.innerHTML+=`<option value="${v}">${v}</option>`;
});
}

let currentDistricts=[];

function applyCurrentFilter(){

let muni=document.getElementById("municipalityFilter").value;
let date=document.getElementById("dateFilter").value;
let search=normalize(document.getElementById("searchBox").value);
let top=document.getElementById("filterSelect").value;

filteredData=rawData.filter(d=>{
return (muni==="all"||d.municipality===muni) &&
(date==="all"||d.date===date) &&
d.district.includes(search);
});

let grouped={};

filteredData.forEach(d=>{
if(!grouped[d.district])grouped[d.district]=[];
grouped[d.district].push(d);
});

let districts=Object.keys(grouped).map(name=>{
let pts=grouped[name];
return {
name,
points:pts,
count:pts.length,
centerLat:pts.reduce((s,p)=>s+p.lat,0)/pts.length,
centerLng:pts.reduce((s,p)=>s+p.lng,0)/pts.length
};
}).sort((a,b)=>b.count-a.count);

if(top==="5")districts=districts.slice(0,5);
if(top==="10")districts=districts.slice(0,10);

currentDistricts=districts;

drawMap(districts);
drawCharts(districts);
}

function convexHull(points){
const pts=points.map(p=>[p.lat,p.lng]);

if(pts.length<=3)return pts.map(p=>({lat:p[0],lng:p[1]}));

pts.sort((a,b)=>a[0]===b[0]?a[1]-b[1]:a[0]-b[0]);

const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);

const lower=[],upper=[];

for(const p of pts){
while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0){
lower.pop();
}
lower.push(p);
}

for(let i=pts.length-1;i>=0;i--){
const p=pts[i];
while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0){
upper.pop();
}
upper.push(p);
}

upper.pop(); lower.pop();

return lower.concat(upper).map(p=>({lat:p[0],lng:p[1]}));
}

function drawMap(districts){

polygons.forEach(p=>map.removeLayer(p));
labels.forEach(l=>map.removeLayer(l));
polygons=[];labels=[];

let zoom=map.getZoom();

districts.forEach(d=>{

let hull=convexHull(d.points);

let factor=zoom<10?0.5:zoom<13?0.2:0.05;

hull=hull.map(p=>({
lat:d.centerLat+(p.lat-d.centerLat)*(1+factor),
lng:d.centerLng+(p.lng-d.centerLng)*(1+factor)
}));

let poly=L.polygon(hull.map(p=>[p.lat,p.lng]),{
color:"#2563eb",
fillOpacity:0.3
}).addTo(map);

polygons.push(poly);

if(zoom>=11){
let label=L.marker([d.centerLat,d.centerLng],{
icon:L.divIcon({
html:`<div class="mapLabel">${d.name} (${d.count})</div>`
})
}).addTo(map);

labels.push(label);
}

});
}

function drawCharts(districts){

let districtNames=districts.map(d=>d.name);
let districtCounts=districts.map(d=>d.count);

let categoryCount={};

filteredData.forEach(d=>{
categoryCount[d.category]=(categoryCount[d.category]||0)+1;
});

if(chart1)chart1.destroy();
if(chart2)chart2.destroy();

chart1=new Chart(document.getElementById("chartDistrict"),{
type:'bar',
data:{labels:districtNames,datasets:[{data:districtCounts}]}
});

chart2=new Chart(document.getElementById("chartCategory"),{
type:'bar',
data:{
labels:Object.keys(categoryCount),
datasets:[{data:Object.values(categoryCount),backgroundColor:"#16a34a"}]
}
});
}

initMap();

</script>

</body>
</html>
