<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>استخراج الحي والشارع</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
    font-family:tahoma;
    text-align:center;
    margin-top:50px;
    background:#f5f7fb
}
button{
    padding:10px 20px;
    background:#0ea5e9;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer
}
button:hover{background:#0284c7}
</style>
</head>

<body>

<h2>📊 استخراج الحي والشارع</h2>

<input type="file" id="file"><br><br>
<button onclick="loadExcel()">🚀 تشغيل الاستخراج</button>

<script>

// 🔥🔥🔥 هنا فقط تحط مفتاحك 🔥🔥🔥
const API_KEY = "PUT_YOUR_API_KEY_HERE";

let resultData=[];

function loadExcel(){
    const file=document.getElementById("file").files[0];
    if(!file){alert("اختر ملف");return;}

    const reader=new FileReader();
    reader.onload=e=>{
        const data=new Uint8Array(e.target.result);
        const workbook=XLSX.read(data,{type:"array"});
        const sheet=workbook.Sheets[workbook.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{header:1});

        process(rows);
    };
    reader.readAsArrayBuffer(file);
}

async function process(rows){

    resultData=[["x","y","الحي","الشارع"]];

    for(let i=1;i<rows.length;i++){

        const row=rows[i];
        if(!row) continue;

        const lng=parseFloat(row[0]); // X
        const lat=parseFloat(row[1]); // Y

        if(isNaN(lat)||isNaN(lng)) continue;

        const info=await getAddress(lat,lng);

        resultData.push([
            lng,
            lat,
            info.district,
            info.street
        ]);

        console.log("تم:",i);
    }

    exportExcel();
    alert("تم الاستخراج كامل ✅🔥");
}


// 🔥 دالة استخراج العنوان (محسنة)
function getAddress(lat,lng){

    return fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${API_KEY}&language=ar`)
    .then(res=>res.json())
    .then(data=>{

        let street="";
        let district="";

        if(data.results.length){

            data.results[0].address_components.forEach(c=>{

                // الشارع
                if(c.types.includes("route")){
                    street = c.long_name;
                }

                // الحي (كل الاحتمالات)
                if(
                    c.types.includes("sublocality") ||
                    c.types.includes("neighborhood") ||
                    c.types.includes("sublocality_level_1")
                ){
                    district = c.long_name;
                }

            });

            // fallback
            if(!district){
                district = data.results[0].formatted_address.split(",")[0];
            }
        }

        return {
            street: street || "",
            district: district || ""
        };

    })
    .catch(()=>{
        return {street:"",district:""};
    });
}


function exportExcel(){
    const ws=XLSX.utils.aoa_to_sheet(resultData);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"نتائج");
    XLSX.writeFile(wb,"نتائج_الاستخراج.xlsx");
}

</script>

</body>
</html>
