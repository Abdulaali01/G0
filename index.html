<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحليل الأحياء - النسخة الخارقة</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:tahoma;background:#f5f7fb}
.top{
position:absolute;top:10px;left:50%;transform:translateX(-50%);
background:#fff;padding:10px;border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:1000;
display:flex;gap:6px;flex-wrap:wrap
}
.top input,.top select,.top button{
padding:6px;border-radius:8px;border:1px solid #ddd
}
.top button{background:#0ea5e9;color:#fff;border:none;cursor:pointer}
#map{height:65vh}
.bottomWrap{display:grid;grid-template-columns:300px 1fr;gap:10px;padding:10px}
.card{background:#fff;padding:10px;border-radius:12px}
.mapLabel{background:#fff;padding:4px 8px;border-radius:6px;font-size:12px}
</style>
</head>

<body>

<div class="top">
<input type="file" id="file">
<button onclick="loadExcel()">رفع</button>

<select id="municipalityFilter" onchange="applyCurrentFilter()">
<option value="all">كل البلديات</option>
</select>

<select id="dateFilter" onchange="applyCurrentFilter()">
<option value="all">كل الأشهر</option>
</select>

<select id="filterSelect" onchange="applyCurrentFilter()">
<option value="all">الكل</option>
<option value="5">أعلى 5</option>
<option value="10">أعلى 10</option>
</select>

<input id="searchBox" placeholder="بحث..." oninput="applyCurrentFilter()">

<button onclick="fitAll()">إظهار الكل</button>
<button onclick="exportExcel()">تصدير</button>
<button onclick="clearAllData()">مسح</button>
</div>

<div id="map"></div>

<div class="bottomWrap">
<div class="card">
<div>إجمالي: <span id="totalReports">0</span></div>
<div>أحياء: <span id="totalDistricts">0</span></div>
<div>الأعلى: <span id="topDistrict">-</span></div>
<div id="legendBox"></div>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>
</div>

<script>
let map;
let polygons=[],labels=[];
let rawDistricts=[],visibleDistricts=[];
let chart=null;
let exportRows=[];

function initMap(){
map=L.map('map').setView([21.4,40.4],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function loadExcel(){
const file=document.getElementById("file").files[0];
const reader=new FileReader();
reader.onload=e=>{
const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
processRows(rows);
};
reader.readAsArrayBuffer(file);
}

function processRows(rows){
let mapData={},total=0;
let muniSet=new Set(),dateSet=new Set();

for(let i=1;i<rows.length;i++){
let r=rows[i];
let lng=parseFloat(r[0]),lat=parseFloat(r[1]);
let name=r[2]||"غير معروف";
let muni=r[3]||"غير محدد";
let date=r[4]||"غير معروف";

if(isNaN(lat)||isNaN(lng))continue;

total++;
muniSet.add(muni);
dateSet.add(date);

let key=name+"||"+muni;

if(!mapData[key]){
mapData[key]={name,muni,date,points:[]};
}
mapData[key].points.push({lat,lng});
}

rawDistricts=Object.values(mapData).map(d=>{
let cLat=d.points.reduce((s,p)=>s+p.lat,0)/d.points.length;
let cLng=d.points.reduce((s,p)=>s+p.lng,0)/d.points.length;
return {...d,count:d.points.length,centerLat:cLat,centerLng:cLng};
}).sort((a,b)=>b.count-a.count);

fillSelect("municipalityFilter",muniSet);
fillSelect("dateFilter",dateSet);

document.getElementById("totalReports").textContent=total;
document.getElementById("totalDistricts").textContent=rawDistricts.length;
document.getElementById("topDistrict").textContent=rawDistricts[0]?.name||"-";

applyCurrentFilter();
}

function fillSelect(id,set){
let sel=document.getElementById(id);
sel.innerHTML='<option value="all">الكل</option>';
[...set].forEach(v=>{
sel.innerHTML+=`<option value="${v}">${v}</option>`;
});
}

function applyCurrentFilter(){
let muni=document.getElementById("municipalityFilter").value;
let date=document.getElementById("dateFilter").value;
let top=document.getElementById("filterSelect").value;
let search=document.getElementById("searchBox").value;

let arr=rawDistricts.filter(d=>{
return (muni==="all"||d.muni==muni) &&
(date==="all"||d.date==date) &&
d.name.includes(search);
});

if(top==="5")arr=arr.slice(0,5);
if(top==="10")arr=arr.slice(0,10);

visibleDistricts=arr;

draw();
}

function draw(){
clearMapLayers();

visibleDistricts.forEach((d,i)=>{
let poly=L.polygon(d.points.map(p=>[p.lat,p.lng]),{
color:"#2563eb",fillOpacity:0.3
}).addTo(map);

let label=L.marker([d.centerLat,d.centerLng],{
icon:L.divIcon({html:`<div class="mapLabel">${d.name} (${d.count})</div>`})
}).addTo(map);

polygons.push(poly);
labels.push(label);
});

drawChart();
buildLegend();
buildExport();
fitAll();
}

function drawChart(){
if(chart)chart.destroy();
chart=new Chart(document.getElementById("chart"),{
type:'bar',
data:{
labels:visibleDistricts.map(d=>d.name),
datasets:[{data:visibleDistricts.map(d=>d.count)}]
}
});
}

function buildLegend(){
document.getElementById("legendBox").innerHTML=
visibleDistricts.map(d=>`${d.name} (${d.count})`).join("<br>");
}

function buildExport(){
exportRows=[["الحي","عدد"]];
visibleDistricts.forEach(d=>{
exportRows.push([d.name,d.count]);
});
}

function exportExcel(){
let ws=XLSX.utils.aoa_to_sheet(exportRows);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"data");
XLSX.writeFile(wb,"result.xlsx");
}

function clearMapLayers(){
polygons.forEach(p=>map.removeLayer(p));
labels.forEach(l=>map.removeLayer(l));
polygons=[];labels=[];
}

function clearAllData(){
location.reload();
}

function fitAll(){
let bounds=[];
visibleDistricts.forEach(d=>{
d.points.forEach(p=>bounds.push([p.lat,p.lng]));
});
if(bounds.length)map.fitBounds(bounds);
}

initMap();
</script>

</body>
</html>
