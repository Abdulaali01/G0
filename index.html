<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استخراج جماعي احترافي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:tahoma}
#map{height:100vh;width:100%}
.top{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:#fff;
padding:10px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
z-index:10;
display:flex;
gap:10px
}
button{padding:6px 12px;border:none;background:#0ea5e9;color:#fff;border-radius:6px}
</style>
</head>

<body>

<div class="top">
<input type="file" id="file">
<button onclick="loadExcel()">رفع</button>
<button onclick="exportExcel()">تصدير</button>
</div>

<div id="map"></div>

<script>
let map;
let markers=[];
let resultData=[];

function initMap(){
    map=new google.maps.Map(document.getElementById("map"),{
        center:{lat:21.4,lng:40.4},
        zoom:10,
        mapTypeId:"hybrid"
    });
}

function loadExcel(){
    const file=document.getElementById("file").files[0];
    if(!file){alert("اختر ملف");return;}

    const reader=new FileReader();
    reader.onload=e=>{
        const data=new Uint8Array(e.target.result);
        const workbook=XLSX.read(data,{type:"array"});
        const sheet=workbook.Sheets[workbook.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{header:1});

        process(rows);
    };
    reader.readAsArrayBuffer(file);
}

async function process(rows){
    clearMap();
    resultData=[["x","y","الحي","الشارع"]];

    let batchSize = 10;

    for(let i=1;i<rows.length;i+=batchSize){

        let promises = [];

        for(let j=i;j<i+batchSize && j<rows.length;j++){

            const row=rows[j];
            if(!row) continue;

            const lng=parseFloat(row[0]);
            const lat=parseFloat(row[1]);
            const district=row[2] || "";

            if(isNaN(lat) || isNaN(lng)) continue;

            addMarker(lat,lng,district);

            promises.push(
                getAddress(lat,lng).then(info=>{
                    resultData.push([
                        lng,
                        lat,
                        info.district || district,
                        info.street || ""
                    ]);
                })
            );
        }

        await Promise.all(promises);

        console.log("تمت دفعة:", i);
    }

    alert("تم الاستخراج الجماعي ✅🔥");
}

function addMarker(lat,lng,name){
    const marker=new google.maps.Marker({
        position:{lat,lng},
        map:map
    });
    markers.push(marker);
}

function clearMap(){
    markers.forEach(m=>m.setMap(null));
    markers=[];
}

// ✅ دالة محسّنة لاستخراج اسم الحي بدقة
function getAddress(lat,lng){
    return new Promise(resolve=>{
        const url=`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=AIzaSyBXJ_hCbWG7doWTL1bU_UgRAb4OSnMI5U0&language=ar`;

        fetch(url)
        .then(res=>res.json())
        .then(data=>{
            if(data.results.length>0){
                const comp=data.results[0].address_components;
                const formattedAddress = data.results[0].formatted_address || "";

                let street="";
                let district="";

                // 🔍 البحث عن الشارع (route)
                comp.forEach(c=>{
                    if(c.types.includes("route")) street=c.long_name;
                });

                // 🔍 البحث عن الحي بترتيب الأولوية (من الأدق إلى الأعم)
                // neighborhood = الحي المباشر
                // sublocality_level_1 = الحي/المنطقة الفرعية
                // sublocality = المنطقة المحلية
                // locality = المدينة (مثل الطائف)
                
                const districtTypes = [
                    "neighborhood",           // الحي المباشر
                    "sublocality_level_1",    // الحي/الحي الفرعي
                    "sublocality",            // المنطقة المحلية
                    "administrative_area_level_3", // المستوى الإداري 3
                    "administrative_area_level_2"  // المستوى الإداري 2
                ];

                for(let type of districtTypes){
                    const found = comp.find(c => c.types.includes(type));
                    if(found){
                        district = found.long_name;
                        // تجنب أسماء المدن الكبيرة إذا وجدنا حي أصغر
                        if(type !== "locality" && type !== "administrative_area_level_2"){
                            break;
                        }
                    }
                }

                // 🚫 إذا كان الناتج اسم مدينة كبيرة (مثل الطائف)، نحاول استخراج من العنوان المنسق
                if(!district || district === "الطائف" || district === "Taif" || district === "مكة" || district === "Mecca"){
                    // محاولة استخراج من formatted_address
                    // العنوان المنسق يكون مثل: "123 شارع..., حي..., الطائف..."
                    const parts = formattedAddress.split(',').map(p => p.trim());
                    if(parts.length >= 2){
                        // نأخذ الجزء قبل المدينة مباشرة
                        const possibleDistrict = parts[parts.length - 2]; // العنصر قبل الأخير (المدينة)
                        if(possibleDistrict && possibleDistrict !== district && 
                           !possibleDistrict.includes("السعودية") && 
                           !possibleDistrict.includes("Saudi Arabia")){
                            district = possibleDistrict;
                        }
                    }
                }

                resolve({street,district});
            }else{
                resolve({street:"",district:""});
            }
        })
        .catch(()=>resolve({street:"",district:""}));
    });
}

function exportExcel(){
    const ws=XLSX.utils.aoa_to_sheet(resultData);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"نتائج");
    XLSX.writeFile(wb,"نتائج_جماعية.xlsx");
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXJ_hCbWG7doWTL1bU_UgRAb4OSnMI5U0&callback=initMap" async defer></script>

</body>
</html>
