<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تقرير صور A4</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;background:#eee;font-family:Tahoma}
.topbar{background:#111;color:#fff;padding:8px;display:flex;gap:10px}
.topbar button{padding:6px 12px;cursor:pointer}

.page{width:210mm;height:297mm;border:1px solid #000;padding:10mm;background:#fff;margin:10mm auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}

.img-box{border:1px solid #000;height:60mm;position:relative}
.img-box img{width:100%;height:100%;object-fit:contain}
.img-box.selected{outline:4px solid #22c55e}

.num{position:absolute;top:2mm;right:2mm;background:#000;color:#fff;padding:2mm 3mm;display:none}

.add{position:absolute;bottom:2mm;left:2mm;width:10mm;height:10mm;border-radius:50%;background:#2563eb;color:#fff;text-align:center;line-height:10mm;cursor:pointer}
.edit{position:absolute;bottom:2mm;right:2mm;background:#16a34a;color:#fff;padding:2mm 4mm;font-size:12px;cursor:pointer}

.note-editor{position:absolute;inset:0;background:#fff;display:none;flex-direction:column;padding:4mm}
.note-editor textarea{flex:1;resize:none;font-family:Tahoma;font-size:14px;line-height:1.6}
.note-editor button{margin-top:4mm}

.picker{position:absolute;bottom:14mm;left:2mm;background:#fff;border:1px solid #000;display:none}
.picker button{display:block;width:100%;border:none;padding:5px}

input{display:none}
</style>
</head>

<body>

<div class="topbar">
<button onclick="enableSelect()">🔗 ربط التقرير</button>
<button onclick="printPDF()">🖨️ طباعة التقرير</button>
</div>

<div class="page">
<div class="grid" id="grid"></div>
</div>

<script>
const grid=document.getElementById("grid");
let selectMode=false;
let selected=[];
const notes={};
const meta={};

function pad2(n){return String(n).padStart(2,"0");}
function formatDate(d){return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear();}
function formatTime(d){return pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds());}

for(let i=1;i<=12;i++){
grid.innerHTML+=`
<div class="img-box" id="box${i}" onclick="toggle(${i})">
<div class="num">${i}</div>
<div class="add" onclick="openPicker(event,${i})">+</div>
<div class="edit" onclick="openEditor(event,${i})">✏️ تحرير</div>

<div class="note-editor" id="editor${i}">
<textarea id="note${i}"></textarea>
<button onclick="saveNote(${i})">💾 حفظ</button>
</div>

<div class="picker" id="picker${i}">
<button onclick="openFile(${i},0)">📷 كاميرا</button>
<button onclick="openFile(${i},1)">🖼️ استديو</button>
</div>

<input type="file" accept="image/*" capture="environment" onchange="loadImg(${i},this,true)">
<input type="file" accept="image/*" onchange="loadImg(${i},this,false)">
</div>`;
}

function enableSelect(){
selectMode=true;
selected=[];
document.querySelectorAll(".img-box").forEach(b=>b.classList.remove("selected"));
alert("اختر الصور ثم اطبع التقرير");
}

function toggle(i){
if(!selectMode)return;
const box=document.getElementById("box"+i);
box.classList.toggle("selected");
if(box.classList.contains("selected"))selected.push(i);
else selected=selected.filter(x=>x!==i);
}

function loadImg(i,input,isCamera){
const box=document.getElementById("box"+i);
box.querySelectorAll("img").forEach(x=>x.remove());
const f=input.files[0];
if(!f)return;

const img=document.createElement("img");
img.src=URL.createObjectURL(f);
box.appendChild(img);
box.querySelector(".num").style.display="block";

if(isCamera){
const d=new Date();
meta[i]={lat:"",lng:"",date:formatDate(d),time:formatTime(d)};
navigator.geolocation.getCurrentPosition(pos=>{
meta[i].lat=pos.coords.latitude.toFixed(6);
meta[i].lng=pos.coords.longitude.toFixed(6);
});
}else meta[i]=null;
}

function openPicker(e,i){e.stopPropagation();document.getElementById("picker"+i).style.display="block";}
function openFile(i,n){document.querySelectorAll("#box"+i+" input")[n].click();document.getElementById("picker"+i).style.display="none";}

function openEditor(e,i){e.stopPropagation();document.getElementById("editor"+i).style.display="flex";document.getElementById("note"+i).value=notes[i]||"";}
function saveNote(i){notes[i]=document.getElementById("note"+i).value;document.getElementById("editor"+i).style.display="none";}

async function printPDF(){
if(!selected.length){alert("لم يتم اختيار أي صورة");return;}

document.querySelectorAll(".add,.edit").forEach(e=>e.style.display="none");

const {jsPDF}=window.jspdf;
const pdf=new jsPDF("p","mm","a4");

const now=new Date();
const dd=pad2(now.getDate()),mm=pad2(now.getMonth()+1),yyyy=now.getFullYear();

/* العنوان */
const titleDiv=document.createElement("div");
titleDiv.style.width="180mm";
titleDiv.style.padding="6mm";
titleDiv.style.textAlign="center";
titleDiv.style.background="linear-gradient(90deg,#f3f4f6,#e6efe9,#f3f4f6)";
titleDiv.innerHTML=`
<img src="data:image/svg+xml;utf8,
<svg xmlns='http://www.w3.org/2000/svg' width='600' height='80'>
<text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle'
style='font-family:Tahoma;font-size:48px;font-weight:900;fill:%230f172a'>تقرير الصور</text>
</svg>" style="width:140mm;margin:auto;display:block"/>
<div>التاريخ: ${dd}/${mm}/${yyyy}</div>
`;
document.body.appendChild(titleDiv);
const titleCanvas=await html2canvas(titleDiv,{scale:2});
const titleImg=titleCanvas.toDataURL("image/jpeg");
document.body.removeChild(titleDiv);

function drawTitle(){pdf.addImage(titleImg,"JPEG",15,10,180,22);}
drawTitle();

let y=35;

for(let i of selected){

if(y+90>280){pdf.addPage();drawTitle();y=35;}

const box=document.getElementById("box"+i);
const imgCanvas=await html2canvas(box,{scale:2});
const imgData=imgCanvas.toDataURL("image/jpeg");
pdf.addImage(imgData,"JPEG",15,y,45,75);

/* ==== بطاقة البيانات مع عكس الإحداثيات ==== */
const m=meta[i]||{};
const lng = m.lng || "-";
const lat = m.lat || "-";

const card=document.createElement("div");
card.style.width="45mm";
card.style.height="22mm";
card.style.padding="4mm";
card.style.borderRadius="8px";
card.style.background="linear-gradient(135deg,#f8fafc,#eef2f7,#e8f3ee)";
card.innerHTML=`
<div>📍 ${lng} , ${lat}</div>
<div>📅 ${m.date||"-"}</div>
<div>⏱️ ${m.time||"-"}</div>
`;
card.style.position="fixed";card.style.left="-9999px";
document.body.appendChild(card);

const cardCanvas=await html2canvas(card,{scale:2});
const cardImg=cardCanvas.toDataURL("image/jpeg");
document.body.removeChild(card);

pdf.addImage(cardImg,"JPEG",15,y+77,45,22);

/* الملاحظات */
const temp=document.createElement("div");
temp.style.width="100mm";
temp.style.height="67mm";
temp.style.padding="6mm";
temp.style.background="linear-gradient(135deg,#f1f1f1,#e6efe9,#dbe7e1)";
temp.textContent=notes[i]||"";
temp.style.position="fixed";temp.style.left="-9999px";
document.body.appendChild(temp);

const noteCanvas=await html2canvas(temp,{scale:2});
const noteImg=noteCanvas.toDataURL("image/jpeg");
document.body.removeChild(temp);

pdf.addImage(noteImg,"JPEG",85,y,100,67);

y+=105;
}

pdf.save(`تقرير_الصور_${dd}-${mm}-${yyyy}.pdf`);

document.querySelectorAll(".add,.edit").forEach(e=>e.style.display="");
selectMode=false;
}
</script>

</body>
</html>
