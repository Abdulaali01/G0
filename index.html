<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحليل الأحياء - النسخة المحدثة</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<!-- SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Leaflet Simple Map Screenshoter -->
<script src="https://unpkg.com/leaflet-simple-map-screenshoter@0.5.0/dist/leaflet-simple-map-screenshoter.js"></script>
<!-- FileSaver -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding-bottom: 20px;
}

/* شريط التحكم العلوي - ثابت */
.top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px);
    padding: 12px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 100000;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 3px solid #667eea;
}

.top-bar input,
.top-bar select,
.top-bar button {
    padding: 8px 14px;
    border-radius: 10px;
    border: 2px solid #e0e0e0;
    font-size: 13px;
    transition: all 0.3s ease;
}

.top-bar button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 600;
}

.top-bar button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

/* زر التصدير الخاص */
.btn-export {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%) !important;
}

/* الحاوية الرئيسية */
.main-container {
    margin-top: 80px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* الخريطة - حاوية منفصلة */
.map-wrapper {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    position: relative;
    height: 65vh;
    min-height: 500px;
}

#map {
    height: 100%;
    width: 100%;
    position: relative;
    z-index: 1;
}

/* شريط الزوم المخصص - مثبت داخل الخريطة */
.custom-zoom {
    position: absolute;
    bottom: 30px;
    right: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
    border: 2px solid #667eea;
}

.zoom-btn {
    width: 48px;
    height: 48px;
    border: none;
    background: white;
    font-size: 24px;
    cursor: pointer;
    transition: all 0.3s;
    color: #667eea;
    font-weight: bold;
}

.zoom-btn:hover {
    background: #667eea;
    color: white;
}

.zoom-btn:first-child {
    border-bottom: 1px solid #e0e0e0;
}

/* قسم الإحصائيات والرسوم */
.stats-section {
    display: grid;
    grid-template-columns: 280px 1fr 1fr;
    gap: 20px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

.card-title {
    font-size: 18px;
    font-weight: 700;
    color: #333;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 3px solid #667eea;
    display: flex;
    align-items: center;
    gap: 8px;
}

.stat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    border-radius: 10px;
    font-size: 14px;
}

.stat-value {
    font-weight: 700;
    color: #667eea;
    font-size: 18px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    margin-bottom: 5px;
    border-radius: 8px;
    transition: background 0.3s;
    cursor: pointer;
}

.legend-item:hover {
    background: #f0f0f0;
}

.legend-color {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* حاوية الرسم البياني */
.chart-container {
    position: relative;
    height: 300px;
    width: 100%;
}

/* ملصقات الخريطة */
.map-label {
    background: rgba(255, 255, 255, 0.95);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    border: 2px solid;
    transition: all 0.3s ease;
}

/* للتصدير - نخفي العناصر */
.print-mode .top-bar,
.print-mode .custom-zoom,
.print-mode .leaflet-control-container {
    display: none !important;
}

/* زر تصدير الخريطة المنفصل */
.map-export-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    z-index: 1000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.map-export-btn:hover {
    transform: scale(1.05);
}

/* تنسيق للطباعة */
@media print {
    .top-bar, .custom-zoom {
        display: none !important;
    }
    .main-container {
        margin-top: 0;
    }
}
</style>
</head>

<body>

<!-- شريط التحكم -->
<div class="top-bar">
    <input type="file" id="file" accept=".xlsx,.xls">
    <button onclick="loadExcel()">📁 رفع ملف Excel</button>
    
    <select id="municipalityFilter" onchange="applyCurrentFilter()">
        <option value="all">🏛️ كل البلديات</option>
    </select>
    
    <select id="dateFilter" onchange="applyCurrentFilter()">
        <option value="all">📅 كل الأشهر</option>
    </select>
    
    <select id="filterSelect" onchange="applyCurrentFilter()">
        <option value="all">📊 الكل</option>
        <option value="5">⭐ أعلى 5</option>
        <option value="10">⭐ أعلى 10</option>
    </select>
    
    <input id="searchBox" placeholder="🔍 بحث عن حي..." oninput="applyCurrentFilter()">
    
    <button onclick="fitAll()">🌍 إظهار الكل</button>
    <button class="btn-export" onclick="exportFullReport()">📸 تصدير التقرير كامل</button>
    <button onclick="exportExcel()">📊 تصدير Excel</button>
    <button onclick="clearAllData()" style="background: #ff4757 !important;">🗑️ مسح</button>
</div>

<!-- الحاوية الرئيسية -->
<div class="main-container" id="reportArea">
    
    <!-- الخريطة -->
    <div class="map-wrapper" id="mapContainer">
        <div id="map"></div>
        
        <!-- زر تصدير الخريطة -->
        <button class="map-export-btn" onclick="exportMapOnly()" title="تصدير صورة الخريطة فقط">📷 تصدير الخريطة</button>
        
        <!-- شريط الزوم المخصص -->
        <div class="custom-zoom">
            <button class="zoom-btn" onclick="map.zoomIn()" title="تكبير">+</button>
            <button class="zoom-btn" onclick="map.zoomOut()" title="تصغير">−</button>
        </div>
    </div>
    
    <!-- الإحصائيات والرسوم -->
    <div class="stats-section" id="statsArea">
        
        <!-- بطاقة الإحصائيات -->
        <div class="card">
            <div class="card-title">📈 إحصائيات عامة</div>
            
            <div class="stat-item">
                <span>إجمالي التقارير</span>
                <span class="stat-value" id="totalReports">0</span>
            </div>
            
            <div class="stat-item">
                <span>عدد الأحياء</span>
                <span class="stat-value" id="totalDistricts">0</span>
            </div>
            
            <div class="stat-item">
                <span>الأعلى تقارير</span>
                <span class="stat-value" id="topDistrict">-</span>
            </div>
            
            <div style="margin-top: 20px;">
                <div class="card-title">🎨 دليل الألوان</div>
                <div id="legendBox"></div>
            </div>
        </div>
        
        <!-- الرسم البياني الأول -->
        <div class="card">
            <div class="card-title">📊 توزيع التقارير بالأحياء</div>
            <div class="chart-container">
                <canvas id="chart"></canvas>
            </div>
        </div>
        
        <!-- الرسم البياني الثاني -->
        <div class="card">
            <div class="card-title">📈 توزيع التصنيفات</div>
            <div class="chart-container">
                <canvas id="chart2"></canvas>
            </div>
        </div>
        
    </div>
</div>

<script>

// تسجيل plugin datalabels
Chart.register(ChartDataLabels);

let map;
let screenshoter;
let polygons = [], labels = [];
let rawDistricts = [], visibleDistricts = [];
let chart = null, chart2 = null;
let exportRows = [];
let allMunicipalities = new Set();
let allDates = new Set();
let categoryData = {};

const colors = [
    "#e74c3c", "#e67e22", "#f39c12", "#27ae60", "#16a085",
    "#2980b9", "#8e44ad", "#c0392b", "#2c3e50", "#7f8c8d",
    "#1abc9c", "#3498db", "#9b59b6", "#34495e", "#16a085"
];

// تهيئة الخريطة
function initMap() {
    map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        preferCanvas: true // مهم للتصدير
    }).setView([21.4, 40.4], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        crossOrigin: true // مهم للتصدير
    }).addTo(map);

    // إضافة أداة التصوير
    screenshoter = L.simpleMapScreenshoter({
        screenName: 'خريطة_الأحياء',
        hidden: true, // نخفي الزر الافتراضي ونستخدم زرنا الخاص
        hideElementsWithSelectors: ['.custom-zoom', '.map-export-btn'],
        caption: function() {
            return 'تحليل الأحياء - ' + new Date().toLocaleDateString('ar-SA');
        }
    }).addTo(map);
}

// تحميل Excel
function loadExcel() {
    const file = document.getElementById("file").files[0];
    if (!file) {
        alert('الرجاء اختيار ملف أولاً');
        return;
    }
    
    const reader = new FileReader();
    reader.onload = e => {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        processRows(rows);
    };
    reader.readAsArrayBuffer(file);
}

// معالجة البيانات
function processRows(rows) {
    let mapData = {}, total = 0;
    allMunicipalities.clear();
    allDates.clear();
    categoryData = {};

    for (let i = 1; i < rows.length; i++) {
        let r = rows[i];
        if (!r || r.length < 3) continue;

        let lng = parseFloat(r[0]);
        let lat = parseFloat(r[1]);
        let name = String(r[2] || "غير معروف").trim();
        let muni = String(r[3] || "غير محدد").trim();
        let date = String(r[4] || "غير معروف").trim();
        let category = String(r[5] || "غير محدد").trim();

        if (isNaN(lat) || isNaN(lng)) continue;

        total++;
        allMunicipalities.add(muni);
        allDates.add(date);

        if (!categoryData[category]) categoryData[category] = 0;
        categoryData[category]++;

        let key = name + "||" + muni + "||" + date;
        if (!mapData[key]) {
            mapData[key] = { name, municipality: muni, date, points: [] };
        }
        mapData[key].points.push({ lat, lng });
    }

    fillSelect("municipalityFilter", allMunicipalities);
    fillSelect("dateFilter", allDates);

    rawDistricts = Object.values(mapData).map((d, i) => {
        let cLat = d.points.reduce((s, p) => s + p.lat, 0) / d.points.length;
        let cLng = d.points.reduce((s, p) => s + p.lng, 0) / d.points.length;

        return {
            ...d,
            count: d.points.length,
            centerLat: cLat,
            centerLng: cLng,
            color: colors[i % colors.length]
        };
    }).sort((a, b) => b.count - a.count);

    document.getElementById("totalReports").textContent = total;
    document.getElementById("totalDistricts").textContent = rawDistricts.length;
    document.getElementById("topDistrict").textContent = rawDistricts[0]?.name || "-";

    applyCurrentFilter();
    showNotification(`✅ تم تحميل ${total} تقرير من ${rawDistricts.length} حي`);
}

// ملء القوائم المنسدلة
function fillSelect(id, set) {
    let el = document.getElementById(id);
    let currentValue = el.value;
    el.innerHTML = id === 'municipalityFilter' ? '<option value="all">🏛️ كل البلديات</option>' : '<option value="all">📅 كل الأشهر</option>';
    
    [...set].sort().forEach(v => {
        el.innerHTML += `<option value="${v}">${v}</option>`;
    });
    
    if ([...set].includes(currentValue)) {
        el.value = currentValue;
    }
}

// تطبيق الفلاتر
function applyCurrentFilter() {
    let muni = document.getElementById("municipalityFilter").value;
    let date = document.getElementById("dateFilter").value;
    let top = document.getElementById("filterSelect").value;
    let search = document.getElementById("searchBox").value.toLowerCase();

    let arr = rawDistricts.filter(d =>
        (muni === "all" || d.municipality === muni) &&
        (date === "all" || d.date === date) &&
        d.name.toLowerCase().includes(search)
    );

    if (top === "5") arr = arr.slice(0, 5);
    if (top === "10") arr = arr.slice(0, 10);

    visibleDistricts = arr;
    draw();
    drawCategoryChart();
}

// رسم الخريطة
function draw() {
    clearMapLayers();

    let zoom = map.getZoom();

    visibleDistricts.forEach((d, index) => {
        let hull = convexHull(d.points);
        
        let factor = zoom < 10 ? 0.5 : zoom < 13 ? 0.2 : 0.05;
        
        hull = hull.map(p => ({
            lat: d.centerLat + (p.lat - d.centerLat) * (1 + factor),
            lng: d.centerLng + (p.lng - d.centerLng) * (1 + factor)
        }));

        // إنشاء المضلع
        let poly = L.polygon(hull.map(p => [p.lat, p.lng]), {
            color: d.color,
            fillColor: d.color,
            fillOpacity: 0.4,
            weight: 3,
            dashArray: zoom > 12 ? null : '5, 5'
        }).addTo(map);

        poly.on('mouseover', function() {
            this.setStyle({ fillOpacity: 0.6, weight: 5 });
        });
        poly.on('mouseout', function() {
            this.setStyle({ fillOpacity: 0.4, weight: 3 });
        });

        polygons.push(poly);

        // إضافة ملصق
        let labelSize = zoom >= 14 ? '14px' : zoom >= 11 ? '12px' : '10px';
        let labelPadding = zoom >= 14 ? '8px 16px' : '6px 12px';
        
        let label = L.marker([d.centerLat, d.centerLng], {
            icon: L.divIcon({
                className: 'custom-label',
                html: `<div class="map-label" style="
                    background: rgba(255,255,255,0.95);
                    color: ${d.color};
                    border-color: ${d.color};
                    font-size: ${labelSize};
                    padding: ${labelPadding};
                    border-radius: 20px;
                    font-weight: 700;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                    white-space: nowrap;
                ">${d.name} <span style="background:${d.color};color:white;padding:2px 8px;border-radius:10px;margin-right:5px;">${d.count}</span></div>`,
                iconSize: null
            })
        }).addTo(map);

        labels.push(label);
    });

    drawChart();
    buildLegend();
    buildExport();
}

// خوارزمية Convex Hull
function convexHull(points) {
    const pts = points.map(p => [p.lat, p.lng]);
    if (pts.length <= 3) return pts.map(p => ({ lat: p[0], lng: p[1] }));
    
    pts.sort((a, b) => a[0] === b[0] ? a[1] - b[1] : a[0] - b[0]);
    
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [], upper = [];
    
    for (const p of pts) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
        lower.push(p);
    }
    
    for (let i = pts.length - 1; i >= 0; i--) {
        const p = pts[i];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
        upper.push(p);
    }
    
    upper.pop(); lower.pop();
    return lower.concat(upper).map(p => ({ lat: p[0], lng: p[1] }));
}

// رسم الرسم البياني الأول
function drawChart() {
    if (chart) chart.destroy();

    const ctx = document.getElementById("chart").getContext("2d");
    
    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: visibleDistricts.map(d => d.name),
            datasets: [{
                label: 'عدد التقارير',
                data: visibleDistricts.map(d => d.count),
                backgroundColor: visibleDistricts.map(d => d.color),
                borderRadius: 10,
                borderSkipped: false,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                datalabels: {
                    anchor: 'end',
                    align: 'top',
                    color: '#333',
                    font: { weight: 'bold', size: 12 },
                    formatter: (value) => value
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(0,0,0,0.05)' }
                },
                x: {
                    grid: { display: false },
                    ticks: { maxRotation: 45, minRotation: 45 }
                }
            }
        }
    });
}

// رسم الرسم البياني الثاني
function drawCategoryChart() {
    if (chart2) chart2.destroy();

    const ctx = document.getElementById("chart2").getContext("2d");
    const cats = Object.keys(categoryData);
    const vals = Object.values(categoryData);
    
    chart2 = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: cats,
            datasets: [{
                data: vals,
                backgroundColor: colors.slice(0, cats.length),
                borderWidth: 3,
                borderColor: '#fff',
                hoverOffset: 10
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '60%',
            plugins: {
                legend: {
                    position: 'right',
                    labels: { usePointStyle: true, padding: 15 }
                },
                datalabels: {
                    color: '#fff',
                    font: { weight: 'bold', size: 12 },
                    formatter: (value, ctx) => {
                        let sum = ctx.dataset.data.reduce((a, b) => a + b, 0);
                        return (value * 100 / sum).toFixed(1) + "%";
                    }
                }
            }
        }
    });
}

// بناء الدليل
function buildLegend() {
    const container = document.getElementById("legendBox");
    container.innerHTML = visibleDistricts.slice(0, 10).map(d => `
        <div class="legend-item" onclick="highlightDistrict('${d.name}')">
            <div class="legend-color" style="background: ${d.color}"></div>
            <span>${d.name} (${d.count})</span>
        </div>
    `).join("");
}

// إبراز حي
function highlightDistrict(name) {
    const district = visibleDistricts.find(d => d.name === name);
    if (district) {
        map.flyTo([district.centerLat, district.centerLng], 15, { duration: 1.5 });
    }
}

// بناء بيانات التصدير
function buildExport() {
    exportRows = [["الحي", "البلدية", "التاريخ", "التصنيف", "عدد النقاط"]];
    visibleDistricts.forEach(d => {
        exportRows.push([d.name, d.municipality, d.date, d.category || "غير محدد", d.count]);
    });
}

// تصدير Excel
function exportExcel() {
    if (exportRows.length <= 1) {
        alert('لا توجد بيانات للتصدير');
        return;
    }
    let ws = XLSX.utils.aoa_to_sheet(exportRows);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "الأحياء");
    XLSX.writeFile(wb, "تحليل_الأحياء.xlsx");
}

// تصدير الخريطة فقط (يحافظ على المضلعات!)
function exportMapOnly() {
    showNotification('⏳ جاري تصدير الخريطة...');
    
    screenshoter.takeScreen('blob').then(blob => {
        saveAs(blob, `خريطة_الأحياء_${new Date().toLocaleDateString('ar-SA')}.png`);
        showNotification('✅ تم تصدير الخريطة بنجاح!');
    }).catch(e => {
        console.error(e);
        alert('حدث خطأ في تصدير الخريطة');
    });
}

// تصدير التقرير الكامل (3 صور منفصلة)
async function exportFullReport() {
    showNotification('⏳ جاري تصدير التقرير...');
    
    try {
        // 1. تصدير الخريطة
        const mapBlob = await screenshoter.takeScreen('blob');
        saveAs(mapBlob, `1_الخريطة_${new Date().toLocaleDateString('ar-SA')}.png`);
        
        // 2. تصدير الرسوم البيانية والإحصائيات
        await new Promise(resolve => setTimeout(resolve, 500));
        
        const statsElement = document.getElementById('statsArea');
        
        // استخدام dom-to-image للإحصائيات (لأنها HTML عادي)
        const statsCanvas = await html2canvas(statsElement, {
            scale: 2,
            backgroundColor: '#667eea',
            useCORS: true
        });
        
        statsCanvas.toBlob(blob => {
            saveAs(blob, `2_الإحصائيات_${new Date().toLocaleDateString('ar-SA')}.png`);
        });
        
        showNotification('✅ تم تصدير التقرير (صورتين منفصلتين)!');
    } catch (err) {
        console.error(err);
        alert('حدث خطأ في التصدير');
    }
}

// إظهار الكل
function fitAll() {
    if (visibleDistricts.length === 0) return;
    
    let bounds = [];
    visibleDistricts.forEach(d => {
        d.points.forEach(p => bounds.push([p.lat, p.lng]));
    });
    
    if (bounds.length) {
        map.fitBounds(bounds, { padding: [50, 50] });
    }
}

// مسح الطبقات
function clearMapLayers() {
    polygons.forEach(p => map.removeLayer(p));
    labels.forEach(l => map.removeLayer(l));
    polygons = [];
    labels = [];
}

// مسح الكل
function clearAllData() {
    if (confirm('هل أنت متأكد من مسح جميع البيانات؟')) {
        location.reload();
    }
}

// إشعار
function showNotification(message) {
    const notif = document.createElement('div');
    notif.style.cssText = `
        position: fixed;
        top: 90px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.85);
        color: white;
        padding: 15px 30px;
        border-radius: 30px;
        font-weight: 600;
        z-index: 100001;
        animation: slideIn 0.3s ease;
    `;
    notif.textContent = message;
    document.body.appendChild(notif);
    
    setTimeout(() => {
        notif.style.opacity = '0';
        setTimeout(() => notif.remove(), 300);
    }, 3000);
}

// إضافة html2canvas للإحصائيات
const html2canvasScript = document.createElement('script');
html2canvasScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
document.head.appendChild(html2canvasScript);

// تهيئة
initMap();

</script>
