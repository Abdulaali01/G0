<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بدون API - تجميع ذكي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:tahoma}
#map{height:100vh;width:100%}

.top{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:#fff;
padding:10px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
z-index:10
}
</style>
</head>

<body>

<div class="top">
<input type="file" id="file" accept=".xlsx,.xls" onchange="loadExcel()">
</div>

<div id="map"></div>

<script>
let map;
let markers=[];
let clusters=[];

// ===== الخريطة =====
function initMap(){
    map=new google.maps.Map(document.getElementById("map"),{
        center:{lat:21.4,lng:40.4},
        zoom:10,
        mapTypeId:"hybrid"
    });
}

// ===== قراءة Excel =====
function loadExcel(){

    const file=document.getElementById("file").files[0];
    if(!file){alert("اختر ملف");return;}

    const reader=new FileReader();

    reader.onload=e=>{
        const data=new Uint8Array(e.target.result);
        const workbook=XLSX.read(data,{type:"array"});
        const sheet=workbook.Sheets[workbook.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{header:1});

        process(rows);
    };

    reader.readAsArrayBuffer(file);
}

// ===== المعالجة =====
function process(rows){

    clearMap();
    clusters=[];

    for(let i=1;i<rows.length;i++){

        const row=rows[i];
        if(!row) continue;

        const lng=parseFloat(row[0]);
        const lat=parseFloat(row[1]);
        const district=row[2] || "";

        if(isNaN(lat)||isNaN(lng)) continue;

        addToCluster(lat,lng,district);
    }

    drawClusters();

    alert("تم التجميع بدون API ✅🔥");
}

// ===== التجميع 100 متر =====
function addToCluster(lat,lng,district){

    for(let c of clusters){
        const d = distance(lat,lng,c.lat,c.lng);

        if(d <= 0.1){ // 100 متر
            c.points.push({lat,lng});
            c.count++;

            if(!c.name && district){
                c.name = district;
            }

            return;
        }
    }

    clusters.push({
        lat,
        lng,
        points:[{lat,lng}],
        count:1,
        name:district || "مجموعة"
    });
}

// ===== رسم =====
function drawClusters(){

    clusters.forEach(c=>{

        const marker=new google.maps.Marker({
            position:{lat:c.lat,lng:c.lng},
            map:map,
            label:{
                text:String(c.count),
                color:"#fff",
                fontSize:"14px"
            }
        });

        markers.push(marker);

        // دائرة تمثل الحي
        new google.maps.Circle({
            strokeColor:"#2563eb",
            strokeOpacity:0.8,
            strokeWeight:2,
            fillColor:"#3b82f6",
            fillOpacity:0.2,
            map:map,
            center:{lat:c.lat,lng:c.lng},
            radius:100
        });

    });
}

// ===== مسافة =====
function distance(lat1, lon1, lat2, lon2){
    const R = 6371;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLon = (lon2-lon1)*Math.PI/180;

    const a =
        Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)*Math.sin(dLon/2);

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ===== تنظيف =====
function clearMap(){
    markers.forEach(m=>m.setMap(null));
    markers=[];
}
</script>

<!-- الخريطة فقط (بدون تكلفة) -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCKAdhnhp11pzOQXn8rQxcA-dB5HpSZx0Y&callback=initMap&language=ar&region=SA" async defer></script>

</body>
</html>
