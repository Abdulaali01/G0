<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحليل الأحياء - بدون تكلفة</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:tahoma;background:#f5f7fb}
#map{height:70vh;width:100%}

.top{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:#fff;
padding:10px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
z-index:1000;
display:flex;
gap:10px;
flex-wrap:wrap
}

.chartBox{
height:30vh;
background:#fff;
padding:10px
}
</style>
</head>

<body>

<div class="top">
<input type="file" accept=".xlsx,.xls" onchange="loadExcel()">

<select onchange="applyFilter(this.value)">
<option value="all">الكل</option>
<option value="5">أعلى 5</option>
<option value="10">أعلى 10</option>
</select>
</div>

<div id="map"></div>

<div class="chartBox">
<canvas id="chart"></canvas>
</div>

<script>
let map;
let clusters=[];
let allClusters=[];
let layers=[];
let chart;

// ===== الخريطة =====
map = L.map('map').setView([21.4,40.4],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

// ===== رفع Excel =====
function loadExcel(){

const file=event.target.files[0];
if(!file){alert("اختر ملف");return;}

const reader=new FileReader();

reader.onload=e=>{
const data=new Uint8Array(e.target.result);
const wb=XLSX.read(data,{type:"array"});
const sheet=wb.Sheets[wb.SheetNames[0]];
const rows=XLSX.utils.sheet_to_json(sheet,{header:1});

process(rows);
};

reader.readAsArrayBuffer(file);
}

// ===== المسافة =====
function getDistance(a,b){
const R=6371;
const dLat=(b.lat-a.lat)*Math.PI/180;
const dLng=(b.lng-a.lng)*Math.PI/180;

const x=Math.sin(dLat/2)**2+
Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*
Math.sin(dLng/2)**2;

return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ===== المعالجة =====
function process(rows){

clearMap();
let temp=[];

for(let i=1;i<rows.length;i++){

const row=rows[i];
if(!row) continue;

const lng=parseFloat(row[0]);
const lat=parseFloat(row[1]);
const name=row[2]||"غير معروف";

if(isNaN(lat)||isNaN(lng)) continue;

temp.push({lat,lng,name});
}

// تجميع 100 متر
let grouped=[];

temp.forEach(p=>{

let found=false;

for(let g of grouped){
if(getDistance(p,g)*1000<=100){
g.count++;
found=true;
break;
}
}

if(!found){
grouped.push({
lat:p.lat,
lng:p.lng,
name:p.name,
count:1
});
}

});

clusters=grouped;
allClusters=[...clusters];

applyFilter("all");
}

// ===== الفلترة =====
function applyFilter(val){

clearMap();

let sorted=[...allClusters].sort((a,b)=>b.count-a.count);

if(val==="5"){
clusters=sorted.slice(0,5);
}else if(val==="10"){
clusters=sorted.slice(0,10);
}else{
clusters=sorted;
}

drawAll();
drawChart();
}

// ===== رسم =====
function drawAll(){

clusters.forEach(c=>{

const color = c.count>10 ? "red" : c.count>5 ? "orange" : "green";

const circle=L.circle([c.lat,c.lng],{
radius:800,
color:color,
fillColor:color,
fillOpacity:0.5
}).addTo(map);

circle.bindPopup(c.name+" ("+c.count+")");

layers.push(circle);

});

}

// ===== الرسم البياني =====
function drawChart(){

const ctx=document.getElementById("chart");

if(chart) chart.destroy();

chart=new Chart(ctx,{
type:"bar",
data:{
labels:clusters.map(c=>c.name),
datasets:[{
data:clusters.map(c=>c.count),
backgroundColor:"blue"
}]
}
});
}

// ===== تنظيف =====
function clearMap(){
layers.forEach(l=>map.removeLayer(l));
layers=[];
}
</script>

</body>
</html>
