<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استخراج ذكي بدون تكرار</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:tahoma}
#map{height:100vh;width:100%}
.top{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:#fff;
padding:10px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
z-index:10;
display:flex;
gap:10px
}
button{padding:6px 12px;border:none;background:#0ea5e9;color:#fff;border-radius:6px}
</style>
</head>

<body>

<div class="top">
<input type="file" id="file">
<button onclick="loadExcel()">رفع</button>
<button onclick="exportExcel()">تصدير</button>
</div>

<div id="map"></div>

<script>
let map;
let markers=[];
let resultData=[];

// كاش دائم
let cache = JSON.parse(localStorage.getItem("geoCache") || "{}");

function initMap(){
    map=new google.maps.Map(document.getElementById("map"),{
        center:{lat:21.4,lng:40.4},
        zoom:10,
        mapTypeId:"hybrid"
    });
}

// حساب المسافة
function getDistance(lat1, lon1, lat2, lon2){
    const R = 6371;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLon = (lon2-lon1) * Math.PI/180;

    const a =
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;

    return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))) * 1000;
}

// البحث عن نقطة قريبة
function findNearby(lat, lng){
    for(let key in cache){
        const [clat, clng] = key.split(",").map(Number);
        const dist = getDistance(lat, lng, clat, clng);

        if(dist <= 60){
            return {
                ...cache[key],
                note:"📍 نقطة قريبة ≤60م"
            };
        }
    }
    return null;
}

function loadExcel(){
    const file=document.getElementById("file").files[0];
    if(!file){alert("اختر ملف");return;}

    const reader=new FileReader();
    reader.onload=e=>{
        const data=new Uint8Array(e.target.result);
        const workbook=XLSX.read(data,{type:"array"});
        const sheet=workbook.Sheets[workbook.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{header:1});

        process(rows);
    };
    reader.readAsArrayBuffer(file);
}

async function process(rows){
    clearMap();

    resultData=[["X","Y","الحي","الشارع","ملاحظة"]];

    for(let i=1;i<rows.length;i++){

        const row=rows[i];
        if(!row) continue;

        const lng=parseFloat(row[0]);
        const lat=parseFloat(row[1]);
        const district=row[2] || "";

        if(isNaN(lat) || isNaN(lng)) continue;

        addMarker(lat,lng,district);

        const info = await getAddress(lat,lng);

        resultData.push([
            lng,
            lat,
            info.district || district,
            info.street || "",
            info.note || ""
        ]);
    }

    alert("تم الاستخراج الذكي ✅🔥");
}

function addMarker(lat,lng,name){
    const marker=new google.maps.Marker({
        position:{lat,lng},
        map:map
    });
    markers.push(marker);
}

function clearMap(){
    markers.forEach(m=>m.setMap(null));
    markers=[];
}

// الدالة الذكية
function getAddress(lat,lng){
    return new Promise(resolve=>{

        const key = lat.toFixed(6)+","+lng.toFixed(6);

        if(cache[key]){
            resolve({...cache[key],note:"✅ من الكاش"});
            return;
        }

        const nearby = findNearby(lat,lng);
        if(nearby){
            resolve(nearby);
            return;
        }

        const url = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=AIzaSyBXJ_hCbWG7doWTL1bU_UgRAb4OSnMI5U0&language=ar`;

        fetch(url)
        .then(res=>res.json())
        .then(data=>{
            let street="", district="";

            if(data.results && data.results.length>0){
                const comp=data.results[0].address_components;

                comp.forEach(c=>{
                    if(c.types.includes("route")) street=c.long_name;
                    if(c.types.includes("neighborhood") || c.types.includes("sublocality")){
                        district=c.long_name;
                    }
                });
            }

            const result={street,district,note:"🌐 API"};

            cache[key]=result;
            localStorage.setItem("geoCache",JSON.stringify(cache));

            resolve(result);
        })
        .catch(()=>resolve({street:"",district:"",note:"❌ خطأ"}));
    });
}

function exportExcel(){
    const ws=XLSX.utils.aoa_to_sheet(resultData);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"نتائج");
    XLSX.writeFile(wb,"نتائج_ذكية.xlsx");
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXJ_hCbWG7doWTL1bU_UgRAb4OSnMI5U0&callback=initMap" async defer></script>

</body>
</html>
