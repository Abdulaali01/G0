<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحليل الأحياء الاحترافي</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:tahoma;background:#f5f7fb}
#map{height:70vh;width:100%}

.top{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:#fff;
padding:10px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
z-index:10;
display:flex;
gap:10px
}

.chartBox{
height:30vh;
background:#fff;
padding:10px
}
</style>
</head>

<body>

<div class="top">
<input type="file" accept=".xlsx,.xls" onchange="loadExcel()">

<select onchange="applyFilter(this.value)">
<option value="all">الكل</option>
<option value="5">أعلى 5</option>
<option value="10">أعلى 10</option>
</select>
</div>

<div id="map"></div>

<div class="chartBox">
<canvas id="chart"></canvas>
</div>

<script>
let map;
let clusters=[];
let allClusters=[];
let circles=[];
let markers=[];
let chart;

const colors=[
"#ef4444","#22c55e","#3b82f6","#f59e0b","#8b5cf6",
"#ec4899","#14b8a6","#eab308","#6366f1","#10b981"
];

function initMap(){
map=new google.maps.Map(document.getElementById("map"),{
center:{lat:21.4,lng:40.4},
zoom:10,
mapTypeId:"hybrid"
});
}

function loadExcel(){

const file=event.target.files[0];
if(!file){alert("اختر ملف");return;}

const reader=new FileReader();

reader.onload=e=>{
const data=new Uint8Array(e.target.result);
const wb=XLSX.read(data,{type:"array"});
const sheet=wb.Sheets[wb.SheetNames[0]];
const rows=XLSX.utils.sheet_to_json(sheet,{header:1});

process(rows);
};

reader.readAsArrayBuffer(file);
}

function process(rows){

clearAll();
clusters=[];

for(let i=1;i<rows.length;i++){

const row=rows[i];
if(!row) continue;

const lng=parseFloat(row[0]);
const lat=parseFloat(row[1]);
const name=row[2]||"حي غير معروف";

if(isNaN(lat)||isNaN(lng)) continue;

addCluster(lat,lng,name);
}

allClusters=[...clusters];
applyFilter("all");
}

function addCluster(lat,lng,name){

for(let c of clusters){
const d=distance(lat,lng,c.lat,c.lng);

if(d<=0.1){
c.points.push({lat,lng});
c.count++;
if(c.name==="حي غير معروف" && name) c.name=name;
return;
}
}

clusters.push({
lat,lng,
points:[{lat,lng}],
count:1,
name:name||"حي غير معروف"
});
}

function applyFilter(val){

clearAll();

let sorted=[...allClusters].sort((a,b)=>b.count-a.count);

if(val==="5"){
clusters=sorted.slice(0,5);
}else if(val==="10"){
clusters=sorted.slice(0,10);
}else{
clusters=sorted;
}

drawAll();
drawChart();
}

function drawAll(){

clusters.forEach((c,i)=>{

const color=colors[i%colors.length];

// 🔥 تم التعديل هنا
const circle=new google.maps.Circle({
center:{lat:c.lat,lng:c.lng},
radius:800, // ✅ جاهز لك
strokeColor:color,
strokeOpacity:1,
strokeWeight:2,
fillColor:color,
fillOpacity:0.3,
map:map
});

circles.push(circle);

const label=new google.maps.Marker({
position:{lat:c.lat,lng:c.lng},
map:map,
label:{
text: c.name + " ("+c.count+")",
color:"#000",
fontSize:"14px",
fontWeight:"bold"
},
icon:{
path: google.maps.SymbolPath.CIRCLE,
scale:0
}
});

markers.push(label);

});
}

function drawChart(){

const ctx=document.getElementById("chart");

if(chart) chart.destroy();

chart=new Chart(ctx,{
type:"bar",
data:{
labels:clusters.map(c=>c.name),
datasets:[{
data:clusters.map(c=>c.count),
backgroundColor:colors
}]
},
options:{
responsive:true,
plugins:{legend:{display:false}}
}
});
}

function distance(lat1, lon1, lat2, lon2){
const R=6371;
const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function clearAll(){
markers.forEach(m=>m.setMap(null));
circles.forEach(c=>c.setMap(null));
markers=[];
circles=[];
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCKAdhnhp11pzOQXn8rQxcA-dB5HpSZx0Y&callback=initMap&language=ar&region=SA" async defer></script>

</body>
</html>
