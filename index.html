<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>تحليل الأحياء - النسخة الاحترافية</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:tahoma;background:#f5f7fb}
.top{
position:absolute;top:10px;left:50%;transform:translateX(-50%);
background:#fff;padding:10px;border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:1000;
display:flex;gap:6px;flex-wrap:wrap
}
.top input,.top select,.top button{padding:6px;border-radius:8px;border:1px solid #ddd}
.top button{background:#0ea5e9;color:#fff;border:none}

#map{height:60vh}

.bottomWrap{
display:grid;
grid-template-columns:300px 1fr 1fr;
gap:10px;
padding:10px
}

.card{background:#fff;padding:10px;border-radius:12px}
.mapLabel{background:#fff;padding:4px 6px;border-radius:6px;font-size:12px}
</style>
</head>

<body>

<div class="top">
<input type="file" id="file">
<button onclick="loadExcel()">رفع</button>

<select id="municipalityFilter" onchange="applyCurrentFilter()">
<option value="all">كل البلديات</option>
</select>

<select id="dateFilter" onchange="applyCurrentFilter()">
<option value="all">كل الأشهر</option>
</select>

<select id="filterSelect" onchange="applyCurrentFilter()">
<option value="all">الكل</option>
<option value="5">أعلى 5</option>
<option value="10">أعلى 10</option>
</select>

<input id="searchBox" placeholder="بحث..." oninput="applyCurrentFilter()">

<button onclick="fitAll()">إظهار الكل</button>
</div>

<div id="map"></div>

<div class="bottomWrap">

<div class="card">
<div>إجمالي: <span id="totalReports">0</span></div>
<div>أحياء: <span id="totalDistricts">0</span></div>
<div>الأعلى: <span id="topDistrict">-</span></div>
</div>

<div class="card">
<canvas id="chartDistrict"></canvas>
</div>

<div class="card">
<canvas id="chartCategory"></canvas>
</div>

</div>

<script>
let map,polygons=[],labels=[];
let rawData=[],filteredData=[];
let chart1,chart2;

function initMap(){
map=L.map('map').setView([21.4,40.4],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function loadExcel(){
const file=document.getElementById("file").files[0];
const reader=new FileReader();

reader.onload=e=>{
const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});

rawData=[];
let muniSet=new Set(),dateSet=new Set();

for(let i=1;i<rows.length;i++){
let r=rows[i];
let item={
lng:+r[0],
lat:+r[1],
district:r[2],
municipality:r[3],
date:r[4],
category:r[5]
};
if(isNaN(item.lat)||isNaN(item.lng))continue;

rawData.push(item);
muniSet.add(item.municipality);
dateSet.add(item.date);
}

fillSelect("municipalityFilter",muniSet);
fillSelect("dateFilter",dateSet);

applyCurrentFilter();
};

reader.readAsArrayBuffer(file);
}

function fillSelect(id,set){
let el=document.getElementById(id);
el.innerHTML='<option value="all">الكل</option>';
[...set].forEach(v=>{
el.innerHTML+=`<option>${v}</option>`;
});
}

function applyCurrentFilter(){

let muni=document.getElementById("municipalityFilter").value;
let date=document.getElementById("dateFilter").value;
let search=document.getElementById("searchBox").value;

filteredData=rawData.filter(d=>{
return (muni==="all"||d.municipality==muni) &&
(date==="all"||d.date==date) &&
d.district.includes(search);
});

draw();
drawCharts();
}

function draw(){
polygons.forEach(p=>map.removeLayer(p));
labels.forEach(l=>map.removeLayer(l));
polygons=[];labels=[];

let groups={};

filteredData.forEach(d=>{
if(!groups[d.district])groups[d.district]=[];
groups[d.district].push(d);
});

Object.keys(groups).forEach(name=>{
let pts=groups[name].map(p=>[p.lat,p.lng]);

let poly=L.polygon(pts,{color:"#2563eb"}).addTo(map);
polygons.push(poly);

let center=poly.getBounds().getCenter();

let label=L.marker(center,{
icon:L.divIcon({html:`<div class="mapLabel">${name}</div>`})
}).addTo(map);

labels.push(label);
});

}

function drawCharts(){

let districtCount={};
let catCount={};

filteredData.forEach(d=>{
districtCount[d.district]=(districtCount[d.district]||0)+1;
catCount[d.category]=(catCount[d.category]||0)+1;
});

let dLabels=Object.keys(districtCount);
let dValues=Object.values(districtCount);

let cLabels=Object.keys(catCount);
let cValues=Object.values(catCount);

if(chart1)chart1.destroy();
if(chart2)chart2.destroy();

chart1=new Chart(document.getElementById("chartDistrict"),{
type:'bar',
data:{labels:dLabels,datasets:[{data:dValues}]}
});

chart2=new Chart(document.getElementById("chartCategory"),{
type:'bar',
data:{labels:cLabels,datasets:[{data:cValues,backgroundColor:"#16a34a"}]}
});
}

function fitAll(){
let bounds=[];
filteredData.forEach(p=>bounds.push([p.lat,p.lng]));
if(bounds.length)map.fitBounds(bounds);
}

initMap();
</script>

</body>
</html>
