<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة اختبار</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#f5f7fb;
}
#map{
height:100vh;
width:100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script>

// إنشاء الخريطة
function initMap(){
    const map = new google.maps.Map(document.getElementById("map"),{
        center:{lat:21.3891,lng:39.8579}, // مكة
        zoom:10,
        mapTypeId:"hybrid",
        gestureHandling:"greedy"
    });

    // مثال نقطة
    new google.maps.Marker({
        position:{lat:21.3891,lng:39.8579},
        map:map,
        title:"موقع تجريبي"
    });
}

</script>

<!-- 🔥 المفتاح الشغال -->
<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCKAdhnhp11pzOQXn8rQxcA-dB5HpSZx0Y&callback=initMap&language=ar&region=SA">
</script>

</body>
</html>
