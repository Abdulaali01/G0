<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استخراج جماعي احترافي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:tahoma}
#map{height:100vh;width:100%}

.top{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:#fff;
padding:10px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
z-index:10;
display:flex;
gap:10px
}

button{
padding:6px 12px;
border:none;
background:#0ea5e9;
color:#fff;
border-radius:6px;
cursor:pointer
}

input{padding:6px}
</style>
</head>

<body>

<div class="top">
<input type="file" id="file">
<button onclick="loadExcel()">رفع</button>
<button onclick="exportExcel()">تصدير</button>
</div>

<div id="map"></div>

<script>
let map;
let markers=[];
let resultData=[["x","y","الحي","ملاحظة"]];

// ✅ كاش ذكي
let cache = JSON.parse(localStorage.getItem("geoCache") || "{}");

function initMap(){
    map=new google.maps.Map(document.getElementById("map"),{
        center:{lat:21.4,lng:40.4},
        zoom:10,
        mapTypeId:"hybrid",
        gestureHandling:"greedy"
    });
}

function loadExcel(){
    const file=document.getElementById("file").files[0];
    if(!file){alert("اختر ملف");return;}

    const reader=new FileReader();
    reader.onload=e=>{
        const data=new Uint8Array(e.target.result);
        const workbook=XLSX.read(data,{type:"array"});
        const sheet=workbook.Sheets[workbook.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
        process(rows);
    };
    reader.readAsArrayBuffer(file);
}

async function process(rows){
    clearMap();
    resultData=[["x","y","الحي","ملاحظة"]];

    for(let i=1;i<rows.length;i++){

        const row=rows[i];
        if(!row) continue;

        const lng=parseFloat(row[0]);
        const lat=parseFloat(row[1]);

        if(isNaN(lat) || isNaN(lng)) continue;

        addMarker(lat,lng);

        let info = getFromCache(lat,lng);

        if(info){
            resultData.push([lng,lat,info.district,"من الكاش"]);
            continue;
        }

        const data = await getAddress(lat,lng);

        if(data.district){
            saveToCache(lat,lng,data);
            resultData.push([lng,lat,data.district,"جديد"]);
        }else{
            resultData.push([lng,lat,"غير معروف",""]);
        }
    }

    alert("تم الاستخراج ✅🔥");
}

// ✅ البحث في الكاش (حتى لو قريب 100 متر)
function getFromCache(lat,lng){
    for(let key in cache){
        const c = cache[key];
        const d = distance(lat,lng,c.lat,c.lng);
        if(d <= 0.1){ // 100 متر
            return c;
        }
    }
    return null;
}

// ✅ حفظ في الكاش
function saveToCache(lat,lng,data){
    const key = lat.toFixed(5)+","+lng.toFixed(5);
    cache[key]={lat,lng,...data};
    localStorage.setItem("geoCache",JSON.stringify(cache));
}

// ✅ حساب المسافة
function distance(lat1, lon1, lat2, lon2){
    const R = 6371;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLon = (lon2-lon1)*Math.PI/180;
    const a =
        Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function addMarker(lat,lng){
    const marker=new google.maps.Marker({
        position:{lat,lng},
        map:map
    });
    markers.push(marker);
}

function clearMap(){
    markers.forEach(m=>m.setMap(null));
    markers=[];
}

// ✅ استخراج الحي فقط (بدون شارع)
function getAddress(lat,lng){
    return new Promise(resolve=>{
        const url=`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=AIzaSyCKAdhnhp11pzOQXn8rQxcA-dB5HpSZx0Y&language=ar`;

        fetch(url)
        .then(res=>res.json())
        .then(data=>{
            if(data.results.length>0){
                const comp=data.results[0].address_components;

                let district="";

                const types=[
                    "neighborhood",
                    "sublocality_level_1",
                    "sublocality"
                ];

                for(let t of types){
                    const found=comp.find(c=>c.types.includes(t));
                    if(found){
                        district=found.long_name;
                        break;
                    }
                }

                resolve({district});
            }else{
                resolve({district:""});
            }
        })
        .catch(()=>resolve({district:""}));
    });
}

function exportExcel(){
    const ws=XLSX.utils.aoa_to_sheet(resultData);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"نتائج");
    XLSX.writeFile(wb,"نتائج_ذكية.xlsx");
}
</script>

<!-- ✅ نفس إعدادات الكود الكبير -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCKAdhnhp11pzOQXn8rQxcA-dB5HpSZx0Y&libraries=geometry&callback=initMap&language=ar&region=SA" async defer></script>

</body>
</html>
