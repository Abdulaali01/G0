<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحليل الأحياء - مجاني</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<!-- Leaflet (مجاني) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:tahoma;background:#f5f7fb}
.top{
position:absolute;top:10px;left:50%;transform:translateX(-50%);
background:#fff;padding:10px;border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.2);z-index:1000;
display:flex;gap:10px;flex-wrap:wrap
}
#map{height:70vh;width:100%;z-index:1}
.chartBox{height:30vh;background:#fff;padding:10px}
button{
padding:6px 12px;border:none;background:#0ea5e9;color:#fff;
border-radius:6px;cursor:pointer
}
</style>
</head>

<body>

<div class="top">
<input type="file" id="file">
<button onclick="loadExcel()">رفع</button>
<select onchange="applyFilter(this.value)">
<option value="all">الكل</option>
<option value="5">أعلى 5</option>
<option value="10">أعلى 10</option>
</select>
</div>

<div id="map"></div>
<div class="chartBox">
<canvas id="chart"></canvas>
</div>

<script>
let map;
let markers=[];
let polygons=[];
let clusters=[];
let allClusters=[];
let chart=null;

// ===== الخريطة المجانية =====
function initMap(){
// خريطة Leaflet مجانية (بدون مفتاح)
map = L.map('map').setView([21.4, 40.4], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);
}

// ===== رفع Excel =====
function loadExcel(){
const file=document.getElementById("file").files[0];
if(!file){alert("اختر ملف");return;}
const reader=new FileReader();
reader.onload=e=>{
const data=new Uint8Array(e.target.result);
const workbook=XLSX.read(data,{type:"array"});
const sheet=workbook.Sheets[workbook.SheetNames[0]];
const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
process(rows);
};
reader.readAsArrayBuffer(file);
}

// ===== معالجة البيانات =====
function process(rows){
clearMap();
let mapData={};
for(let i=1;i<rows.length;i++){
const row=rows[i];
if(!row) continue;
const lat=parseFloat(row[1]);
const lng=parseFloat(row[0]);
const name=(row[2]||"غير معروف").trim();
if(isNaN(lat)||isNaN(lng)) continue;
if(!mapData[name]){
mapData[name]={name:name,points:[],count:0};
}
mapData[name].points.push({lat,lng});
mapData[name].count++;
}
allClusters=Object.values(mapData);
clusters=[...allClusters];
drawAll();
drawChart();
}

// ===== رسم =====
function drawAll(){
clearMap();
clusters.forEach(c=>{
const color = c.count>10 ? "#dc2626" : c.count>5 ? "#f59e0b" : "#16a34a";
const hull = convexHull(c.points);

// مضلع Leaflet
const polygon = L.polygon(hull.map(p=>[p.lat,p.lng]), {
color: color,
fillColor: color,
fillOpacity: 0.35,
weight: 2
}).addTo(map);
polygons.push(polygon);

// علامة Leaflet
const marker = L.marker([hull[0].lat, hull[0].lng]).addTo(map)
.bindPopup(c.name + " (" + c.count + ")");
markers.push(marker);
});
}

// ===== Convex Hull =====
function convexHull(points){
points = points.map(p=>[p.lat,p.lng]);
points.sort((a,b)=> a[0]===b[0]?a[1]-b[1]:a[0]-b[0]);
const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
let lower=[];
for(let p of points){
while(lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],p)<=0){
lower.pop();
}
lower.push(p);
}
let upper=[];
for(let i=points.length-1;i>=0;i--){
let p=points[i];
while(upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],p)<=0){
upper.pop();
}
upper.push(p);
}
upper.pop();
lower.pop();
return lower.concat(upper).map(p=>({lat:p[0],lng:p[1]}));
}

// ===== فلترة =====
function applyFilter(val){
let sorted=[...allClusters].sort((a,b)=>b.count-a.count);
if(val==="5"){clusters=sorted.slice(0,5);}
else if(val==="10"){clusters=sorted.slice(0,10);}
else{clusters=sorted;}
drawAll();
drawChart();
}

// ===== الرسم البياني =====
function drawChart(){
const ctx=document.getElementById("chart");
if(chart) chart.destroy();
chart=new Chart(ctx,{
type:"bar",
data:{
labels:clusters.map(c=>c.name),
datasets:[{
data:clusters.map(c=>c.count),
backgroundColor:"#2563eb"
}]
},
options:{responsive:true}
});
}

// ===== تنظيف =====
function clearMap(){
markers.forEach(m=>map.removeLayer(m));
polygons.forEach(p=>map.removeLayer(p));
markers=[];
polygons=[];
}

// تشغيل الخريطة
initMap();
</script>

</body>
</html>
