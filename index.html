<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تقرير صور A4</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;background:#eee;font-family:Tahoma}

/* شريط علوي */
.topbar{
  background:#111;color:#fff;
  padding:8px;display:flex;gap:10px
}
.topbar button{padding:6px 12px;cursor:pointer}

/* الصفحة */
.page{
  width:210mm;height:297mm;
  border:1px solid #000;
  padding:10mm;background:#fff;
  margin:10mm auto
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5mm
}

/* الصورة */
.img-box{
  border:1px solid #000;
  height:60mm;
  position:relative
}
.img-box img{width:100%;height:100%;object-fit:contain}
.img-box.selected{outline:4px solid #22c55e}

/* رقم الصورة */
.num{
  position:absolute;top:2mm;right:2mm;
  background:#000;color:#fff;
  padding:2mm 3mm;display:none
}

/* زر الإضافة */
.add{
  position:absolute;bottom:2mm;left:2mm;
  width:10mm;height:10mm;
  border-radius:50%;
  background:#2563eb;color:#fff;
  text-align:center;line-height:10mm;
  cursor:pointer
}

/* زر التحرير */
.edit{
  position:absolute;bottom:2mm;right:2mm;
  background:#16a34a;color:#fff;
  padding:2mm 4mm;
  font-size:12px;cursor:pointer
}

/* محرر الملاحظة */
.note-editor{
  position:absolute;
  inset:0;
  background:#fff;
  display:none;
  flex-direction:column;
  padding:4mm;
}
.note-editor textarea{
  flex:1;
  resize:none;
  font-family:Tahoma;
  font-size:14px;
  line-height:1.6;
}
.note-editor button{margin-top:4mm}

/* اختيار مصدر */
.picker{
  position:absolute;bottom:14mm;left:2mm;
  background:#fff;border:1px solid #000;
  display:none
}
.picker button{display:block;width:100%;border:none;padding:5px}

input{display:none}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="enableSelect()">🔗 ربط التقرير</button>
  <button onclick="printPDF()">🖨️ طباعة التقرير</button>
</div>

<div class="page">
  <div class="grid" id="grid"></div>
</div>

<script>
const grid=document.getElementById("grid");
let selectMode=false;
let selected=[];
const notes={};
const meta={}; // {lat,lng,date,time}

/* === أدوات تنسيق ثابتة (بدون لوكال عربي لتفادي أي خربطة) === */
function pad2(n){ return String(n).padStart(2,"0"); }
function formatDate(d){ return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; }
function formatTime(d){
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

/* إنشاء 12 خانات */
for(let i=1;i<=12;i++){
  grid.innerHTML+=`
  <div class="img-box" id="box${i}" onclick="toggle(${i})">
    <div class="num">${i}</div>
    <div class="add" onclick="openPicker(event,${i})">+</div>
    <div class="edit" onclick="openEditor(event,${i})">✏️ تحرير</div>

    <div class="note-editor" id="editor${i}">
      <textarea id="note${i}" placeholder="اكتب الملاحظة هنا..."></textarea>
      <button onclick="saveNote(${i})">💾 حفظ</button>
    </div>

    <div class="picker" id="picker${i}">
      <button onclick="openFile(${i},0)">📷 كاميرا</button>
      <button onclick="openFile(${i},1)">🖼️ استديو</button>
    </div>

    <!-- 0 = كاميرا (capture) -->
    <input type="file" accept="image/*" capture="environment" onchange="loadImg(${i},this,true)">
    <!-- 1 = استديو -->
    <input type="file" accept="image/*" onchange="loadImg(${i},this,false)">
  </div>`;
}

/* الربط */
function enableSelect(){
  selectMode=true;
  selected=[];
  document.querySelectorAll(".img-box").forEach(b=>b.classList.remove("selected"));
  alert("اختر الصور ثم اطبع التقرير");
}

function toggle(i){
  if(!selectMode) return;
  const box=document.getElementById("box"+i);
  box.classList.toggle("selected");
  if(box.classList.contains("selected")) selected.push(i);
  else selected=selected.filter(x=>x!==i);
}

function loadImg(i,input,isCamera){
  const box=document.getElementById("box"+i);
  box.querySelectorAll("img").forEach(x=>x.remove());

  const f=input.files && input.files[0];
  if(!f) return;

  const img=document.createElement("img");
  img.src=URL.createObjectURL(f);
  box.appendChild(img);
  box.querySelector(".num").style.display="block";

  // نخزن بيانات الكاميرا فقط
  if(isCamera){
    meta[i]={ lat:"", lng:"", date:"", time:"" }; // نحجز مكان
    const d=new Date();
    meta[i].date=formatDate(d);
    meta[i].time=formatTime(d);

    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos=>{
          meta[i].lat = pos.coords.latitude.toFixed(6);
          meta[i].lng = pos.coords.longitude.toFixed(6);
        },
        err=>{
          // لو فشل GPS نخليها فاضية بدل ما نخرب التقرير
          meta[i].lat = "";
          meta[i].lng = "";
        },
        { enableHighAccuracy:true, timeout:8000, maximumAge:0 }
      );
    }
  }else{
    meta[i]=null;
  }
}

function openPicker(e,i){
  e.stopPropagation();
  document.getElementById("picker"+i).style.display="block";
}
function openFile(i,n){
  document.querySelectorAll("#box"+i+" input")[n].click();
  document.getElementById("picker"+i).style.display="none";
}

function openEditor(e,i){
  e.stopPropagation();
  document.getElementById("editor"+i).style.display="flex";
  document.getElementById("note"+i).value=notes[i]||"";
}
function saveNote(i){
  notes[i]=document.getElementById("note"+i).value;
  document.getElementById("editor"+i).style.display="none";
}

/* ===== طباعة PDF: عنوان + صورة + بطاقة بيانات + ملاحظة ===== */
async function printPDF(){
  if(!selected.length){alert("لم يتم اختيار أي صورة");return;}

  // إخفاء الأزرار مؤقتًا
  document.querySelectorAll(".add,.edit").forEach(e=>e.style.display="none");
  document.querySelectorAll(".img-box").forEach(b=>b.classList.remove("selected"));

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF("p","mm","a4");

  // === عنوان رسمي كصورة ويتكرر بكل صفحة ===
  const now=new Date();
  const dd=pad2(now.getDate());
  const mm=pad2(now.getMonth()+1);
  const yyyy=now.getFullYear();

  const titleDiv=document.createElement("div");
  titleDiv.style.width="180mm";
  titleDiv.style.margin="0 auto";
  titleDiv.style.padding="6mm";
  titleDiv.style.fontFamily="Tahoma";
  titleDiv.style.textAlign="center";
  titleDiv.style.borderRadius="10px";
  titleDiv.style.background="linear-gradient(90deg,#f3f4f6,#e6efe9,#f3f4f6)";
  titleDiv.style.border="1px solid #cbd5e1";
  titleDiv.innerHTML = `
    <div style="font-size:20px;font-weight:900;color:#111;letter-spacing:.3px">تقرير الصور</div>
    <div style="margin-top:2mm;font-size:14px;font-weight:700;color:#334155">التاريخ: ${dd}/${mm}/${yyyy}</div>
  `;
  document.body.appendChild(titleDiv);
  const titleCanvas=await html2canvas(titleDiv,{scale:2,backgroundColor:"#fff"});
  const titleImg=titleCanvas.toDataURL("image/jpeg",0.95);
  document.body.removeChild(titleDiv);

  function drawTitle(){
    pdf.addImage(titleImg,"JPEG",15,10,180,22);
  }

  drawTitle();

  // === مقاسات وترتيب ===
  const margin=15;
  const imgW=60;
  const imgH=45;

  const cardH=22;          // بطاقة البيانات تحت الصورة
  const gapAfterBlock=10;  // مسافة بعد كل عنصر
  const blockH = imgH + cardH + 4; // 4mm مسافة صغيرة بين الصورة والبطاقة

  const noteX = margin + imgW + 10;
  const noteW = 190 - noteX;  // عرض مناسب
  const noteH = imgH + cardH; // نفس ارتفاع كتلة الصورة + البطاقة

  let y=35; // بداية المحتوى تحت العنوان

  for(let i of selected){

    // صفحة جديدة إذا ما فيه مساحة
    if(y + blockH > 280){
      pdf.addPage();
      drawTitle();
      y=35;
    }

    const box=document.getElementById("box"+i);

    // 1) صورة الخانة كصورة
    const imgCanvas=await html2canvas(box,{scale:2,backgroundColor:"#fff"});
    const imgData=imgCanvas.toDataURL("image/jpeg",0.95);

    // إطار + صورة
    pdf.roundedRect(margin,y,imgW,imgH,3,3);
    pdf.addImage(imgData,"JPEG",margin,y,imgW,imgH);

    // 2) بطاقة بيانات (HTML -> Canvas -> Image) لتفادي الخرافيش
    const m = meta[i] || {};
    const latlng = (m.lat && m.lng) ? `${m.lat} , ${m.lng}` : "—";
    const dateStr = m.date ? m.date : "—";
    const timeStr = m.time ? m.time : "—";

    const card=document.createElement("div");
    card.style.width = imgW+"mm";
    card.style.height = cardH+"mm";
    card.style.boxSizing="border-box";
    card.style.padding="4mm 4mm";
    card.style.borderRadius="8px";
    card.style.border="1px solid #cbd5e1";
    card.style.background="linear-gradient(135deg,#f8fafc 0%,#eef2f7 55%,#e8f3ee 100%)";
    card.style.fontFamily="Tahoma";
    card.style.color="#0f172a";
    card.style.display="flex";
    card.style.flexDirection="column";
    card.style.justifyContent="center";
    card.style.gap="1.3mm";
    card.style.lineHeight="1.25";
    card.style.whiteSpace="normal";
    card.style.wordBreak="break-word";
    card.innerHTML = `
      <div style="font-size:10.5px;font-weight:800;display:flex;gap:6px;align-items:flex-start;">
        <span style="font-size:12px;">📍</span>
        <span style="display:block;max-width:100%;">${latlng}</span>
      </div>
      <div style="font-size:10.5px;font-weight:800;display:flex;gap:6px;align-items:center;">
        <span style="font-size:12px;">📅</span>
        <span>${dateStr}</span>
      </div>
      <div style="font-size:10.5px;font-weight:800;display:flex;gap:6px;align-items:center;">
        <span style="font-size:12px;">⏱️</span>
        <span>${timeStr}</span>
      </div>
    `;
    // نخفيه خارج الشاشة
    card.style.position="fixed";
    card.style.left="-9999px";
    card.style.top="0";
    document.body.appendChild(card);

    const cardCanvas=await html2canvas(card,{scale:2,backgroundColor:"#fff"});
    const cardImg=cardCanvas.toDataURL("image/jpeg",0.95);
    document.body.removeChild(card);

    const cardY = y + imgH + 2; // تحت الصورة مباشرة
    pdf.roundedRect(margin,cardY,imgW,cardH,3,3);
    pdf.addImage(cardImg,"JPEG",margin,cardY,imgW,cardH);

    // 3) الملاحظات كصورة (لضمان الشكل ولف النص)
    const temp=document.createElement("div");
    temp.style.width=noteW+"mm";
    temp.style.height=noteH+"mm";
    temp.style.boxSizing="border-box";
    temp.style.padding="6mm";
    temp.style.fontFamily="Tahoma";
    temp.style.fontSize="14px";
    temp.style.lineHeight="1.7";
    temp.style.whiteSpace="pre-wrap";
    temp.style.wordBreak="break-word";
    temp.style.borderRadius="10px";
    temp.style.border="1px solid #cbd5e1";
    temp.style.background="linear-gradient(135deg,#f1f1f1 0%,#e6efe9 55%,#dbe7e1 100%)";
    temp.textContent = notes[i] || "";
    temp.style.position="fixed";
    temp.style.left="-9999px";
    temp.style.top="0";
    document.body.appendChild(temp);

    const noteCanvas=await html2canvas(temp,{scale:2,backgroundColor:"#fff"});
    const noteImg=noteCanvas.toDataURL("image/jpeg",0.95);
    document.body.removeChild(temp);

    pdf.roundedRect(noteX,y,noteW,noteH,3,3);
    pdf.addImage(noteImg,"JPEG",noteX,y,noteW,noteH);

    // تحريك للأسفل للصورة التالية
    y += (noteH + gapAfterBlock);
  }

  pdf.save(`تقرير_الصور_${dd}-${mm}-${yyyy}.pdf`);

  // إعادة الأزرار
  document.querySelectorAll(".add,.edit").forEach(e=>e.style.display="");
  selectMode=false;
}
</script>

</body>
</html>
