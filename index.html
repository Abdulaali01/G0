<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استخراج الأحياء والشوارع</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:tahoma;background:#f5f7fb}
#map{height:500px;border-radius:12px;margin-top:15px}

.usage{
position:fixed;top:10px;left:10px;background:#111;color:#fff;
padding:12px;border-radius:12px;font-size:13px;z-index:999
}
</style>
</head>

<body>

<div class="usage">
📊 الاستخدام<br>
المستخدم: <b id="used">0</b><br>
المتبقي: <b id="left">40000</b>
</div>

<div class="p-6">

<input type="file" id="fileInput" class="mb-4">

<button onclick="startExtraction()" class="bg-green-500 text-white px-4 py-2 rounded">
بدء الاستخراج
</button>

<div id="map"></div>

</div>

<script>

// ================== بيانات ==================
let allData = []
let map
let markers = []
let usedRequests = 0
let MAX = 40000

function updateUsage(){
document.getElementById("used").textContent = usedRequests
document.getElementById("left").textContent = MAX - usedRequests
}

// ================== قراءة Excel ==================
document.getElementById("fileInput").addEventListener("change", e=>{
const file = e.target.files[0]
const reader = new FileReader()

reader.onload = function(evt){
const data = new Uint8Array(evt.target.result)
const wb = XLSX.read(data,{type:'array'})
const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]])

allData = json.map((r,i)=>({
id:i+1,
lat: parseFloat(r.lat || r.latitude || r["خط العرض"]),
lng: parseFloat(r.lng || r.lon || r["خط الطول"]),
status:"pending"
}))

showPoints()
}

reader.readAsArrayBuffer(file)
})

// ================== الخريطة ==================
function initMap(){
map = new google.maps.Map(document.getElementById("map"),{
center:{lat:24.7,lng:46.6},
zoom:6,
mapTypeId:"hybrid"
})
}

// ================== عرض النقاط ==================
function showPoints(){

markers.forEach(m=>m.setMap(null))
markers=[]

const bounds = new google.maps.LatLngBounds()

allData.forEach((r,i)=>{

let color = r.status==="completed"?"green":"red"

const marker = new google.maps.Marker({
position:{lat:r.lat,lng:r.lng},
map:map,
icon:{
path:google.maps.SymbolPath.CIRCLE,
scale:6,
fillColor:color,
fillOpacity:1,
strokeColor:"white",
strokeWeight:2
}
})

markers.push(marker)
bounds.extend(marker.getPosition())
})

if(markers.length>0) map.fitBounds(bounds)
}

// ================== الاستخراج ==================
async function startExtraction(){

for(let i=0;i<allData.length;i++){

if(usedRequests>=MAX){
alert("وصلت الحد 40000")
break
}

let r = allData[i]

await new Promise(res=>setTimeout(res,800))

try{

const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${r.lat}&lon=${r.lng}`
const data = await fetch(url).then(res=>res.json())

r.status="completed"
usedRequests++
updateUsage()

}catch{
r.status="error"
}

updateColor(i, r.status==="completed"?"green":"gray")
}

alert("تم الانتهاء")
}

// ================== تغيير اللون ==================
function updateColor(i,color){

if(markers[i]){
markers[i].setIcon({
path:google.maps.SymbolPath.CIRCLE,
scale:6,
fillColor:color,
fillOpacity:1,
strokeColor:"white",
strokeWeight:2
})
}
}

</script>

<!-- 🔥 مفتاحك هنا -->
<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXJ_hCbWG7doWTL1bU_UgRAb4OSnMI5U0&callback=initMap">
</script>

</body>
</html>
