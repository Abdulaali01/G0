<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تقرير الصور A4</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;background:#eee;font-family:Tahoma}

.topbar{background:#111;color:#fff;padding:8px;display:flex;gap:10px}
.topbar button{padding:6px 12px;cursor:pointer}

.page{
width:210mm;
height:297mm;
margin:10mm auto;
background:#fff;
border:1px solid #000;
padding:10mm;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5mm;
}

.img-box{
border:1px solid #000;
height:60mm;
position:relative;
}

.img-box img{
width:100%;
height:100%;
object-fit:contain;
}

.num{
position:absolute;
top:2mm;
right:2mm;
background:#000;
color:#fff;
padding:2px 4px;
font-size:12px;
}

.add{
position:absolute;
bottom:2mm;
left:2mm;
width:10mm;height:10mm;
border-radius:50%;
background:#2563eb;
color:#fff;
text-align:center;
line-height:10mm;
cursor:pointer;
}

.edit{
position:absolute;
bottom:2mm;
right:2mm;
background:#16a34a;
color:#fff;
padding:2mm 4mm;
font-size:12px;
cursor:pointer;
}

.note-editor{
position:absolute;
inset:0;
background:#fff;
display:none;
flex-direction:column;
padding:4mm;
}

.note-editor textarea{
flex:1;
resize:none;
font-size:14px;
line-height:1.5;
white-space:pre-wrap;
word-wrap:break-word;
overflow-wrap:anywhere;
}

.note-editor button{margin-top:4mm}

.picker{
position:absolute;
bottom:14mm;
left:2mm;
background:#fff;
border:1px solid #000;
display:none;
}

.picker button{display:block;width:100%;border:none;padding:5px}

input{display:none}

.gps{
position:absolute;
bottom:2px;
right:2px;
background:rgba(255,255,255,.8);
font-size:12px;
padding:2px 4px;
}
</style>
</head>

<body>

<div class="topbar">
<button onclick="enableSelect()">وضع التحديد</button>
<button onclick="printPDF()">طباعة PDF</button>
<input type="text" id="gpsStatus" placeholder="الصق الإحداثيات هنا">
</div>

<div class="page">
<div class="grid" id="grid"></div>
</div>

<script>
const grid=document.getElementById("grid");
let selectMode=false;
let selected=[];
const notes={};

for(let i=1;i<=12;i++){
grid.innerHTML+=`
<div class="img-box" id="box${i}">
<div class="num">${i}</div>
<div class="gps" id="gps${i}"></div>
<div class="add" onclick="openPicker(event,${i})">+</div>
<div class="edit" onclick="openEditor(event,${i})">ملاحظة</div>

<div class="note-editor" id="editor${i}">
<textarea id="note${i}"></textarea>
<button onclick="saveNote(${i})">حفظ</button>
</div>

<div class="picker" id="picker${i}">
<button onclick="openFile(${i},0)">كاميرا</button>
<button onclick="openFile(${i},1)">استديو</button>
</div>

<input type="file" accept="image/*" capture onchange="loadImg(${i},this)">
<input type="file" accept="image/*" onchange="loadImg(${i},this)">
</div>`;
}

function enableSelect(){selectMode=true;}

function openPicker(e,i){
e.stopPropagation();
document.getElementById("picker"+i).style.display="block";
}

function openFile(i,t){
document.querySelectorAll("input")[i*2-2+t].click();
}

function loadImg(i,input){
if(!input.files[0])return;
const img=document.createElement("img");
img.src=URL.createObjectURL(input.files[0]);
const box=document.getElementById("box"+i);
box.appendChild(img);

document.getElementById("gps"+i).innerText=document.getElementById("gpsStatus").value;

document.getElementById("picker"+i).style.display="none";
}

function openEditor(e,i){
e.stopPropagation();
document.getElementById("editor"+i).style.display="flex";
document.getElementById("note"+i).value=notes[i]||"";
}

function saveNote(i){
notes[i]=document.getElementById("note"+i).value;
document.getElementById("editor"+i).style.display="none";
}

async function printPDF(){
const {jsPDF}=window.jspdf;

const canvas=await html2canvas(document.querySelector(".page"),{scale:3});
const img=canvas.toDataURL("image/jpeg",0.95);

const pdf=new jsPDF("portrait","mm","a4");
pdf.addImage(img,"JPEG",0,0,210,297);
pdf.save("تقرير_الصور_"+new Date().toISOString().slice(0,10)+".pdf");
}
</script>

</body>
</html>
