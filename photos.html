<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير الصور</title>

<style>
body{font-family:Tahoma;background:#f4f6fb;padding:16px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
button{padding:10px;border:none;border-radius:8px;font-weight:bold}
.cam{background:#1a73e8;color:#fff}
.gal{background:#0f9d58;color:#fff}
.print{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.box{background:#fff;border-radius:10px;overflow:hidden}
.box img{width:100%;height:200px;object-fit:cover}
</style>
</head>

<body>

<div class="toolbar">
<button class="cam" onclick="cam.click()">📷 كاميرا</button>
<button class="gal" onclick="gal.click()">🖼️ معرض</button>
<button class="print" id="print">🖨️ طباعة</button>
</div>

<div id="report">
<div class="grid" id="grid"></div>
</div>

<input id="cam" type="file" accept="image/*" capture hidden>
<input id="gal" type="file" accept="image/*" hidden>

<script>
const grid=document.getElementById("grid");
const printBtn=document.getElementById("print");

async function stamp(file){
 return new Promise(r=>{
 navigator.geolocation.getCurrentPosition(p=>{
 const img=new Image();
 img.src=URL.createObjectURL(file);
 img.onload=()=>{
 const c=document.createElement("canvas");
 c.width=img.width;c.height=img.height;
 const x=c.getContext("2d");
 x.drawImage(img,0,0);
 const d=new Date();
 const t=`${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)} | ${d.toLocaleString()}`;
 x.fillStyle="rgba(0,0,0,.6)";
 x.fillRect(0,c.height-90,c.width,90);
 x.fillStyle="#fff";
 x.font="bold 32px Tahoma";
 x.fillText(t,20,c.height-40);
 r(c.toDataURL("image/jpeg",.95));
 };
 });
 });
}

cam.onchange=async e=>{
 if(!e.target.files[0])return;
 const src=await stamp(e.target.files[0]);
 add(src);
};

gal.onchange=e=>{
 if(!e.target.files[0])return;
 add(URL.createObjectURL(e.target.files[0]));
};

function add(src){
 const d=document.createElement("div");
 d.className="box";
 const i=document.createElement("img");
 i.src=src;
 d.appendChild(i);
 grid.appendChild(d);
}

printBtn.onclick=async ()=>{

 const imgs=[...document.querySelectorAll("#grid img")];

 await Promise.all(imgs.map(i=>{
   if(i.complete) return Promise.resolve();
   return new Promise(r=>i.onload=r);
 }));

 window.print();
};
</script>

</body>
</html>
