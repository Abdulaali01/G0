<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تقرير صور A4</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;background:#eee;font-family:Tahoma}

/* شريط علوي */
.topbar{
  background:#111;color:#fff;
  padding:8px;display:flex;gap:10px
}
.topbar button{padding:6px 12px;cursor:pointer}

/* الصفحة */
.page{
  width:210mm;height:297mm;
  border:1px solid #000;
  padding:10mm;background:#fff;
  margin:10mm auto
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5mm
}

/* الصورة */
.img-box{
  border:1px solid #000;
  height:60mm;
  position:relative
}
.img-box img{width:100%;height:100%;object-fit:contain}
.img-box.selected{outline:4px solid #22c55e}

/* رقم الصورة */
.num{
  position:absolute;top:2mm;right:2mm;
  background:#000;color:#fff;
  padding:2mm 3mm;display:none
}

/* زر الإضافة */
.add{
  position:absolute;bottom:2mm;left:2mm;
  width:10mm;height:10mm;
  border-radius:50%;
  background:#2563eb;color:#fff;
  text-align:center;line-height:10mm;
  cursor:pointer
}

/* زر التحرير */
.edit{
  position:absolute;bottom:2mm;right:2mm;
  background:#16a34a;color:#fff;
  padding:2mm 4mm;
  font-size:12px;cursor:pointer
}

/* محرر الملاحظة */
.note-editor{
  position:absolute;
  inset:0;
  background:#fff;
  display:none;
  flex-direction:column;
  padding:4mm;
}
.note-editor textarea{
  flex:1;
  resize:none;
  font-family:Tahoma;
  font-size:14px;
  line-height:1.6;
}
.note-editor button{margin-top:4mm}

/* اختيار مصدر */
.picker{
  position:absolute;bottom:14mm;left:2mm;
  background:#fff;border:1px solid #000;
  display:none
}
.picker button{display:block;width:100%;border:none;padding:5px}

input{display:none}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="enableSelect()">🔗 ربط التقرير</button>
  <button onclick="printPDF()">🖨️ طباعة التقرير</button>
</div>

<div class="page">
  <div class="grid" id="grid"></div>
</div>

<script>
const grid=document.getElementById("grid");
let selectMode=false;
let selected=[];
const notes={};

/* إنشاء 12 خانات */
for(let i=1;i<=12;i++){
  grid.innerHTML+=`
  <div class="img-box" id="box${i}" onclick="toggle(${i})">
    <div class="num">${i}</div>
    <div class="add" onclick="openPicker(event,${i})">+</div>
    <div class="edit" onclick="openEditor(event,${i})">✏️ تحرير</div>

    <div class="note-editor" id="editor${i}">
      <textarea id="note${i}" placeholder="اكتب الملاحظة هنا..."></textarea>
      <button onclick="saveNote(${i})">💾 حفظ</button>
    </div>

    <div class="picker" id="picker${i}">
      <button onclick="openFile(${i},0)">📷 كاميرا</button>
      <button onclick="openFile(${i},1)">🖼️ استديو</button>
    </div>

    <input type="file" accept="image/*" capture onchange="loadImg(${i},this)">
    <input type="file" accept="image/*" onchange="loadImg(${i},this)">
  </div>`;
}

/* الربط */
function enableSelect(){
  selectMode=true;
  selected=[];
  document.querySelectorAll(".img-box").forEach(b=>b.classList.remove("selected"));
  alert("اختر الصور ثم اطبع التقرير");
}

function toggle(i){
  if(!selectMode) return;
  const box=document.getElementById("box"+i);
  box.classList.toggle("selected");
  if(box.classList.contains("selected")) selected.push(i);
  else selected=selected.filter(x=>x!==i);
}

/* ✅ نفس وظيفتك + إضافة طباعة الإحداثيات داخل الصورة (كبيرة وواضحة) */
function loadImg(i,input){
  const file=input.files && input.files[0];
  if(!file) return;

  // جلب الوقت الآن
  const now=new Date();
  const stamp = now.toLocaleString("ar-SA", { hour12: true });

  // دالة: ترسم الصورة + الكتابة داخلها
  function renderWithOverlay(latText,lngText){
    const reader=new FileReader();
    reader.onload=e=>{
      const src=e.target.result;
      const image=new Image();
      image.onload=()=>{
        const c=document.createElement("canvas");
        c.width=image.naturalWidth || image.width;
        c.height=image.naturalHeight || image.height;
        const ctx=c.getContext("2d");

        // الصورة
        ctx.drawImage(image,0,0,c.width,c.height);

        // مقاسات ديناميكية عشان تكون واضحة على أي دقة
        const pad=Math.max(24,Math.round(c.width*0.03));
        const barH=Math.max(140,Math.round(c.height*0.18));
        const font1=Math.max(48,Math.round(c.width*0.055)); // كبير
        const font2=Math.max(42,Math.round(c.width*0.045)); // كبير
        const lineGap=Math.max(16,Math.round(font2*0.35));

        // خلفية أسفل الصورة
        ctx.fillStyle="rgba(0,0,0,0.75)";
        ctx.fillRect(0,c.height-barH,c.width,barH);

        // حدود بيضاء خفيفة (تعزز الوضوح)
        ctx.strokeStyle="rgba(255,255,255,0.35)";
        ctx.lineWidth=Math.max(4,Math.round(c.width*0.005));
        ctx.strokeRect(0,c.height-barH,c.width,barH);

        // كتابة
        ctx.fillStyle="#fff";
        ctx.textAlign="left";
        ctx.textBaseline="top";

        const y0=c.height-barH+Math.max(18,Math.round(barH*0.12));

        ctx.font=`800 ${font1}px Tahoma`;
        ctx.fillText(`LAT: ${latText}   LNG: ${lngText}`, pad, y0);

        ctx.font=`800 ${font2}px Tahoma`;
        ctx.fillText(stamp, pad, y0 + font1 + lineGap);

        // ضع الصورة داخل الخانة
        const box=document.getElementById("box"+i);
        box.querySelectorAll("img").forEach(x=>x.remove());
        const img=document.createElement("img");
        img.src=c.toDataURL("image/jpeg",0.98); // جودة عالية
        box.appendChild(img);
        box.querySelector(".num").style.display="block";
      };
      image.src=src;
    };
    reader.readAsDataURL(file);
  }

  // نحاول نجيب GPS
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const lat=pos.coords.latitude.toFixed(6);
        const lng=pos.coords.longitude.toFixed(6);
        renderWithOverlay(lat,lng);
      },
      _err=>{
        // لو رفض الإذن: نحط N/A بدل الإحداثيات (ولا نكسر شيء)
        renderWithOverlay("N/A","N/A");
      },
      { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
    );
  }else{
    renderWithOverlay("N/A","N/A");
  }
}

function openPicker(e,i){
  e.stopPropagation();
  document.getElementById("picker"+i).style.display="block";
}
function openFile(i,n){
  document.querySelectorAll("#box"+i+" input")[n].click();
  document.getElementById("picker"+i).style.display="none";
}

function openEditor(e,i){
  e.stopPropagation();
  document.getElementById("editor"+i).style.display="flex";
  document.getElementById("note"+i).value=notes[i]||"";
}
function saveNote(i){
  notes[i]=document.getElementById("note"+i).value;
  document.getElementById("editor"+i).style.display="none";
}

/* ===== طباعة PDF والعنوان يتكرر بكل صفحة ===== */
async function printPDF(){
  if(!selected.length){alert("لم يتم اختيار أي صورة");return;}

  // إخفاء الأزرار مؤقتًا
  document.querySelectorAll(".add,.edit").forEach(e=>e.style.display="none");
  document.querySelectorAll(".img-box").forEach(b=>b.classList.remove("selected"));

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF("p","mm","a4");

  /* === إنشاء صورة العنوان مرة واحدة === */
  const now=new Date();
  const dd=String(now.getDate()).padStart(2,"0");
  const mm=String(now.getMonth()+1).padStart(2,"0");
  const yyyy=now.getFullYear();

  const titleDiv=document.createElement("div");
  titleDiv.style.width="180mm";
  titleDiv.style.padding="6mm";
  titleDiv.style.margin="0 auto";
  titleDiv.style.fontFamily="Tahoma";
  titleDiv.style.fontSize="20px";
  titleDiv.style.fontWeight="bold";
  titleDiv.style.textAlign="center";
  titleDiv.style.color="#111";
  titleDiv.style.background="linear-gradient(90deg,#f3f4f6,#e5ece8)";
  titleDiv.style.borderBottom="2px solid #9ca3af";
  titleDiv.textContent=`تقرير الصور ليوم: ${dd} / ${mm} / ${yyyy}`;
  document.body.appendChild(titleDiv);

  const titleCanvas=await html2canvas(titleDiv,{scale:2,backgroundColor:"#fff"});
  const titleImg=titleCanvas.toDataURL("image/jpeg",0.95);
  document.body.removeChild(titleDiv);

  /* دالة لرسم العنوان في أي صفحة */
  function drawTitle(){
    pdf.addImage(titleImg,"JPEG",15,10,180,20);
  }

  drawTitle(); // الصفحة الأولى

  const pageWidth=pdf.internal.pageSize.getWidth();
  const margin=15;
  const gap=8;

  const imgWidth=65;
  const imgHeight=55;

  const noteX=margin+imgWidth+gap;
  const noteWidth=pageWidth-noteX-20;

  let y=35; // نبدأ تحت العنوان

  for(let i of selected){
    if(y+imgHeight>280){
      pdf.addPage();
      drawTitle();   // ← العنوان لكل صفحة
      y=35;
    }

    const box=document.getElementById("box"+i);

    const imgCanvas=await html2canvas(box,{scale:2,backgroundColor:"#fff"});
    const imgData=imgCanvas.toDataURL("image/jpeg",0.95);
    pdf.roundedRect(margin,y,imgWidth,imgHeight,3,3);
    pdf.addImage(imgData,"JPEG",margin,y,imgWidth,imgHeight);

    const temp=document.createElement("div");
    temp.style.width=noteWidth+"mm";
    temp.style.height=imgHeight+"mm";
    temp.style.padding="6mm";
    temp.style.fontFamily="Tahoma";
    temp.style.fontSize="14px";
    temp.style.lineHeight="1.7";
    temp.style.whiteSpace="pre-wrap";
    temp.style.background="linear-gradient(135deg,#f1f1f1 0%,#e6efe9 55%,#dbe7e1 100%)";
    temp.textContent=notes[i]||"";
    document.body.appendChild(temp);

    const noteCanvas=await html2canvas(temp,{scale:2});
    const noteImg=noteCanvas.toDataURL("image/jpeg",0.95);
    document.body.removeChild(temp);

    pdf.roundedRect(noteX,y,noteWidth,imgHeight,3,3);
    pdf.addImage(noteImg,"JPEG",noteX,y,noteWidth,imgHeight);

    y+=imgHeight+12;
  }

  pdf.save(`تقرير_الصور_${dd}-${mm}-${yyyy}.pdf`);

  // إعادة الأزرار
  document.querySelectorAll(".add,.edit").forEach(e=>e.style.display="");
  selectMode=false;
}
</script>

</body>
</html>
